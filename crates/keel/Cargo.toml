[package]
name = "keel"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
sentry.workspace = true
keel-harness.workspace = true
keel-mcp.workspace = true
keel-scanner.workspace = true
keel-providers.workspace = true
keel-generator.workspace = true
keel-workspace.workspace = true

anyhow.workspace = true
clap.workspace = true
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
axum = { workspace = true, features = ["ws"] }
open.workspace = true
ignore.workspace = true
keyring.workspace = true
libc = "0.2"
# kqueue on macOS: per file descriptor, instant, and never a recursive walk of a checkout.
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
sha2 = "0.10"
portable-pty = "0.9.0"
futures-util = "0.3.34"
trash = "5.2.6"

[dev-dependencies]
tempfile = "3"
