<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel</title>
<style>
  :root {
    --bg:#0d1117; --panel:#0f151c; --panel-2:#161d26; --panel-3:#1b2430; --line:#222b37;
    --text:#e3e8ef; --dim:#8b98a9; --faint:#5c6774;
    --accent:#4cc2ff; --crit:#ff6b6b; --high:#ffa657; --med:#e3c565; --low:#7d8ba1; --ok:#56d364;
    --add-bg:rgba(63,185,80,.13); --add-mark:#3fb950;
    --del-bg:rgba(248,81,73,.13); --del-mark:#f85149;
    --k:#c678dd; --s:#98c379; --c:#5c6774; --num:#d19a66; --fn:#61afef;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  }
  @media (prefers-color-scheme:light){:root:not([data-theme=dark]){
    --bg:#fff; --panel:#f7f9fb; --panel-2:#eef2f6; --panel-3:#e4eaf1; --line:#d8dee6;
    --text:#1c2128; --dim:#57606a; --faint:#8b949e;
    --accent:#0969da; --crit:#cf222e; --high:#bc4c00; --med:#9a6700; --low:#6e7781; --ok:#1a7f37;
    --add-bg:rgba(74,194,107,.16); --del-bg:rgba(255,129,130,.18);
    --k:#a626a4; --s:#50a14f; --c:#a0a1a7; --num:#986801; --fn:#4078f2;
  }}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.55 var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  .app{display:grid;grid-template-columns:52px var(--side,272px) 4px 1fr 4px var(--chat,430px);
    height:100vh}
  .rz{cursor:col-resize;background:transparent;position:relative;z-index:5}
  .rz::after{content:"";position:absolute;inset:0 1px;background:var(--line)}
  .rz:hover::after,.rz.on::after{background:var(--accent)}

  /* activity bar */
  .bar{background:var(--panel);border-right:1px solid var(--line);display:flex;
    flex-direction:column;align-items:center;padding:12px 0;gap:2px}
  .bar .logo{margin-bottom:12px;color:var(--text)}
  .ic{all:unset;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;
    cursor:pointer;color:var(--faint);position:relative}
  .ic:hover{background:var(--panel-2);color:var(--text)}
  .ic[aria-current=true]{background:var(--panel-2);color:var(--accent)}
  .ic .badge{position:absolute;top:0;right:0;min-width:15px;height:15px;border-radius:8px;
    background:var(--crit);color:#fff;font:600 9.5px/15px var(--mono);text-align:center;padding:0 3px}
  .ic .badge.mut{background:var(--faint)}
  .bar .spacer{flex:1}

  /* side panel */
  .side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;min-width:0}
  .ph{padding:12px 14px 8px;display:flex;align-items:center;gap:8px;position:sticky;top:0;
    background:var(--panel);z-index:2}
  .ph h3{margin:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--faint);font-weight:600}
  .ph .act{margin-left:auto;font:11px var(--mono);color:var(--faint);cursor:pointer}
  .ph .act:hover{color:var(--accent)}
  .repo{padding:0 14px 10px;font:11px var(--mono);color:var(--faint);word-break:break-all;
    line-height:1.4}
  .grp{border-top:1px solid var(--line)}
  .tnode{display:flex;align-items:center;gap:6px;padding:3px 14px;cursor:pointer;font-size:12.5px;
    color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
  .tnode:hover{background:var(--panel-2);color:var(--text)}
  .tnode.sel{background:var(--panel-2);color:var(--accent)}
  .tnode .caret{width:9px;flex:none;color:var(--faint);font-size:9px}
  .tnode .st{margin-left:auto;font-size:10px;font-weight:700;flex:none;padding-left:8px}
  .st.modified{color:var(--med)} .st.added,.st.untracked{color:var(--ok)}
  .st.deleted{color:var(--crit)} .st.renamed{color:var(--accent)}
  .tkids.collapsed{display:none}
  .side .empty{padding:14px;color:var(--faint);font-size:12px;text-align:left;line-height:1.5}

  /* generic list rows in the side panel */
  .lrow{padding:8px 14px;border-bottom:1px solid var(--line);cursor:default}
  .lrow.click{cursor:pointer}
  .lrow.click:hover{background:var(--panel-2)}
  .lrow .t{font-size:12.5px;font-weight:540;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .lrow .m{font:11px var(--mono);color:var(--faint);margin-top:2px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .lrow .d{font-size:11.5px;color:var(--dim);margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pill{display:inline-block;font:9.5px var(--mono);padding:1.5px 6px;border-radius:4px;
    background:var(--panel-2);color:var(--faint);margin-left:6px;vertical-align:1px}
  .pill.project{color:var(--high);background:color-mix(in srgb,var(--high) 14%,transparent)}
  .pill.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 14%,transparent)}
  .pill.high{color:var(--high);background:color-mix(in srgb,var(--high) 14%,transparent)}
  .pill.medium{color:var(--med);background:color-mix(in srgb,var(--med) 14%,transparent)}
  .pill.low,.pill.info{color:var(--low);background:color-mix(in srgb,var(--low) 14%,transparent)}
  .lrow.danger{border-left:2px solid var(--crit)}

  .fld{padding:10px 14px;border-bottom:1px solid var(--line)}
  .fld label{display:block;font-size:11px;color:var(--faint);margin-bottom:5px}
  .fld input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 9px;font:12px var(--mono);outline:none}
  .fld input:focus{border-color:var(--accent)}
  .fld .row2{display:flex;gap:7px;margin-top:7px;align-items:center}
  .fld .err{color:var(--crit);font-size:11.5px;margin-top:6px}
  .fld .ok{color:var(--ok);font-size:11.5px;margin-top:6px}

  /* editor */
  .ed{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0}
  .tabs{display:flex;height:36px;border-bottom:1px solid var(--line);background:var(--panel);
    flex:none;overflow-x:auto}
  .tab{display:flex;align-items:center;gap:7px;padding:0 11px 0 13px;cursor:pointer;
    border-right:1px solid var(--line);font:12px var(--mono);color:var(--dim);white-space:nowrap;
    flex:none}
  .tab:hover{background:var(--panel-2)}
  .tab.on{background:var(--bg);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
  .tab .x{opacity:.45;font-size:14px;line-height:1}
  .tab .x:hover{opacity:1;color:var(--crit)}
  .tab .dirty{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .subbar{display:flex;align-items:center;gap:12px;padding:0 14px;height:32px;flex:none;
    border-bottom:1px solid var(--line);background:var(--panel);font-size:11.5px;color:var(--faint)}
  .seg{display:flex;background:var(--panel-2);border-radius:6px;padding:2px}
  .seg button{all:unset;padding:2.5px 11px;border-radius:4px;cursor:pointer;font-size:11.5px;
    color:var(--dim)}
  .seg button[aria-current=true]{background:var(--panel-3);color:var(--text)}
  .subbar .right{margin-left:auto;display:flex;gap:10px;align-items:center;overflow:hidden}
  .subbar .right span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kbd{font:10.5px var(--mono);background:var(--panel-2);padding:1px 5px;border-radius:4px;
    color:var(--faint);flex:none}

  .surface{flex:1;overflow:auto;position:relative;padding:12px 0}
  .lines{display:table;width:100%;border-collapse:collapse;font:12.5px/1.62 var(--mono)}
  .ln-row{display:table-row}
  .ln-no,.ln-src{display:table-cell;vertical-align:top}
  .ln-no{text-align:right;color:var(--faint);user-select:none;width:1%;white-space:nowrap;
    padding:0 14px 0 16px}
  .ln-src{white-space:pre-wrap;word-break:break-word;padding-right:24px}
  .k{color:var(--k)}.s{color:var(--s)}.c{color:var(--c);font-style:italic}
  .n{color:var(--num)}.f{color:var(--fn)}
  .edit-wrap{position:relative}
  .edit-wrap textarea,.edit-wrap .hl{font:12.5px/1.62 var(--mono);padding:0;margin:0;border:0;
    white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word}
  .edit-wrap .hl{pointer-events:none;min-height:1.62em}
  .edit-wrap textarea{position:absolute;inset:0;width:100%;height:100%;background:transparent;
    color:transparent;caret-color:var(--accent);resize:none;outline:none;overflow:hidden}
  .edit-wrap textarea::selection{background:color-mix(in srgb,var(--accent) 34%,transparent)}

  /* diff — flex rows, not a CSS table: a one-cell table row cannot span the gutter columns,
     which trapped every hunk header inside the narrow line-number column. */
  .diff{font:12.5px/1.62 var(--mono)}
  .dline{display:flex}
  .dno{width:46px;flex:none;text-align:right;color:var(--faint);user-select:none;padding:0 8px;
    font-size:11.5px}
  .dsrc{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;padding:0 24px 0 20px;
    position:relative}
  .dline.add{background:var(--add-bg)} .dline.del{background:var(--del-bg)}
  .dsrc .mk{position:absolute;left:6px;font-weight:700}
  .dline.add .mk{color:var(--add-mark)} .dline.del .mk{color:var(--del-mark)}
  .hunk{color:var(--accent);background:var(--panel-2);padding:5px 14px;font-size:11.5px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:6px 0 0;
    white-space:pre-wrap;word-break:break-word}

  /* chat */
  .chat{background:var(--panel);border-left:1px solid var(--line);display:flex;
    flex-direction:column;overflow:hidden;min-width:0}
  .chat-head{padding:9px 14px;border-bottom:1px solid var(--line);flex:none;display:flex;
    align-items:center;gap:8px;font-size:12.5px;font-weight:600}
  .chat-head .meta{margin-left:auto;font:11px var(--mono);color:var(--faint);font-weight:400}
  .mode-note{font-size:11px;padding:6px 14px;flex:none;border-bottom:1px solid var(--line);
    line-height:1.45}
  .mode-note.plan{color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .mode-note.auto{color:var(--high);background:color-mix(in srgb,var(--high) 10%,transparent)}
  .log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px}
  .msg .who{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);
    font-weight:600;margin-bottom:4px}
  .msg.user{background:var(--panel-2);border-radius:9px;padding:9px 12px}
  .msg.user .who{color:var(--accent)}
  .txt{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.6}
  .txt code{font:12px var(--mono);background:var(--panel-2);padding:1px 5px;border-radius:4px}
  .txt strong{font-weight:640}
  .think{font-size:12px;color:var(--faint);font-style:italic;border-left:2px solid var(--line);
    padding-left:10px;white-space:pre-wrap}
  /* Tool calls: the argument gets its own wrapping block. A shell command truncated to one line
     is unreadable, and the command is the part you most need to see. */
  .tool{background:var(--panel-2);border-radius:7px;border-left:2px solid var(--accent);
    overflow:hidden}
  .tool .th{display:flex;align-items:center;gap:8px;padding:5px 10px;font:11.5px var(--mono)}
  .tool .tn{color:var(--accent);font-weight:600}
  .tool .tsub{color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tool pre{margin:0;padding:0 10px 8px;font:11.5px/1.5 var(--mono);color:var(--dim);
    white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:auto}
  .composer{border-top:1px solid var(--line);padding:10px;flex:none}
  .composer textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);
    color:var(--text);border-radius:8px;padding:9px 11px;font:13px/1.5 var(--sans);resize:none;
    min-height:58px;outline:none}
  .composer textarea:focus{border-color:var(--accent)}
  .foot{display:flex;align-items:center;gap:8px;margin-top:7px}
  .foot .hint{font:11px var(--mono);color:var(--faint);margin-right:auto;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .btn{all:unset;background:var(--accent);color:#fff;padding:5.5px 14px;border-radius:7px;
    font-size:12.5px;font-weight:560;cursor:pointer;text-align:center}
  .btn:hover{filter:brightness(1.1)} .btn[disabled]{opacity:.4;cursor:default}
  .btn.ghost{background:var(--panel-2);color:var(--dim)}
  .btn.sm{padding:4px 10px;font-size:11.5px}

  /* palette */
  .pal{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,88vw);
    background:var(--panel);border:1px solid var(--line);border-radius:12px;z-index:40;
    box-shadow:0 24px 70px rgba(0,0,0,.45);overflow:hidden}
  .pal input{all:unset;display:block;width:100%;padding:14px 17px;font:14px var(--sans);
    color:var(--text);border-bottom:1px solid var(--line);box-sizing:border-box}
  .pal .res{max-height:44vh;overflow-y:auto}
  .pal .r{padding:8px 17px;font:12.5px var(--mono);color:var(--dim);cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pal .r.on{background:var(--panel-2);color:var(--accent)}
  .hidden{display:none!important}
  .empty{padding:26px 16px;text-align:center;color:var(--faint);font-size:12.5px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar">
    <svg class="logo" width="21" height="21" viewBox="0 0 20 20" fill="none">
      <path d="M10 1.5v17M10 18.5c-3.6 0-6.4-1.9-7.6-4.3M10 18.5c3.6 0 6.4-1.9 7.6-4.3"
        stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <button class="ic" data-p="files" title="Files" aria-current="true">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor"><path d="M2 3a1 1 0 011-1h3.6l1.2 1.5H13a1 1 0 011 1V13a1 1 0 01-1 1H3a1 1 0 01-1-1V3z"/></svg></button>
    <button class="ic" data-p="changes" title="Changes">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2v8.2a2.8 2.8 0 105 1.8h3V2h-2v8H8.9A2.8 2.8 0 006 10.2V2H4z"/></svg>
      <span class="badge mut hidden" data-b="changes">0</span></button>
    <button class="ic" data-p="sessions" title="Sessions">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm.8 3.5v3.9l3 1.8-.8 1.3-3.7-2.2V4.5h1.5z"/></svg>
      <span class="badge mut hidden" data-b="sessions">0</span></button>
    <button class="ic" data-p="skills" title="Skills &amp; extensions">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l2 4.4 4.8.5-3.6 3.2 1 4.7L8 11.4 3.8 13.8l1-4.7L1.2 5.9 6 5.4 8 1z"/></svg></button>
    <button class="ic" data-p="readiness" title="Readiness">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l6 2.6v4c0 3.6-2.5 6.6-6 7.4-3.5-.8-6-3.8-6-7.4v-4L8 1zm2.9 4.6l-3.6 3.6-1.9-1.9-1.1 1.1 3 3 4.7-4.7-1.1-1.1z"/></svg>
      <span class="badge hidden" data-b="readiness">0</span></button>
    <div class="spacer"></div>
    <button class="ic" data-p="connections" title="Connections">
      <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor"><path d="M9.5 2.5a3.5 3.5 0 014.9 4.9l-2 2a3.5 3.5 0 01-5 0l1.1-1.1a2 2 0 002.8 0l2-2a2 2 0 10-2.8-2.8l-.8.8-1.1-1.1.9-.7zM6.5 13.5a3.5 3.5 0 01-4.9-4.9l2-2a3.5 3.5 0 015 0L7.5 7.7a2 2 0 00-2.8 0l-2 2a2 2 0 102.8 2.8l.8-.8 1.1 1.1-.9.7z"/></svg>
      <span class="badge hidden" data-b="conn">!</span></button>
  </div>

  <aside class="side" id="side"></aside>
  <div class="rz" id="rz1"></div>

  <section class="ed">
    <div class="tabs" id="tabs"></div>
    <div class="subbar">
      <div class="seg">
        <button id="m-src" aria-current="true">Source</button>
        <button id="m-diff">Diff</button>
      </div>
      <div class="right"><span id="fmeta"></span>
        <span class="kbd">&#8984;P</span><span class="kbd">&#8984;S</span></div>
    </div>
    <div class="surface" id="surface"><div class="empty">Open a file &mdash; press &#8984;P</div></div>
  </section>

  <div class="rz" id="rz2"></div>

  <section class="chat">
    <div class="chat-head">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--ok)"></span>
      Claude Code<span class="meta" id="chat-meta"></span>
    </div>
    <div class="mode-note" id="mode-note"></div>
    <div class="log" id="log"><div class="empty">Ask Claude Code to change this repository.</div></div>
    <div class="composer">
      <textarea id="prompt" placeholder="Describe a change…   &#8984;&#9166; to send"></textarea>
      <div class="foot">
        <div class="seg">
          <button id="pm-plan">Plan</button>
          <button id="pm-auto" aria-current="true">Auto</button>
        </div>
        <span class="hint" id="hint"></span>
        <button class="btn ghost hidden" id="stop">Stop</button>
        <button class="btn" id="send">Send</button>
      </div>
    </div>
  </section>
</div>

<div class="pal hidden" id="pal">
  <input id="pal-q" placeholder="Go to file…" spellcheck="false">
  <div class="res" id="pal-res"></div>
</div>

<script>
const $ = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
const short = (s, n) => (s ?? '').length > n ? s.slice(0, n - 1) + '…' : (s ?? '');

let state = null, git = null, conn = null, tree = null, flat = [], mode = 'src', panel = 'files';
const tabs = []; let active = null;

// ── panel sizing ─────────────────────────────────────────────────────────────
// Widths persist per browser so the layout someone settles on survives a reload.
function initResize(handle, varName, key, min, max, invert) {
  const stored = localStorage.getItem(key);
  if (stored) document.documentElement.style.setProperty(varName, stored + 'px');
  handle.addEventListener('pointerdown', e => {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    handle.classList.add('on');
    const move = ev => {
      const raw = invert ? window.innerWidth - ev.clientX : ev.clientX - 52;
      const w = Math.max(min, Math.min(max, raw));
      document.documentElement.style.setProperty(varName, w + 'px');
      localStorage.setItem(key, String(w));
    };
    const up = () => {
      handle.classList.remove('on');
      removeEventListener('pointermove', move);
      removeEventListener('pointerup', up);
    };
    addEventListener('pointermove', move);
    addEventListener('pointerup', up);
  });
}
initResize(el('rz1'), '--side', 'keel.side', 180, 520, false);
initResize(el('rz2'), '--chat', 'keel.chat', 300, 760, true);

// ── syntax highlighting ──────────────────────────────────────────────────────
const KW = /\b(fn|let|mut|pub|use|mod|struct|enum|impl|trait|match|if|else|for|while|loop|return|const|static|async|await|move|where|as|dyn|self|Self|crate|super|type|ref|in|break|continue|unsafe|extern|function|var|class|export|import|from|default|new|try|catch|throw|typeof|instanceof|def|elif|except|lambda|with|yield|None|True|False|null|true|false|undefined)\b/g;

function hl(src) {
  let out = esc(src);
  const stash = [];
  // A digit-free sentinel. An index-based placeholder gets mangled by the number rule below
  // before it can be restored, which rendered every comment line as a bare number.
  const MARK = '';
  const keep = h => { stash.push(h); return MARK; };
  // One pass, so stash order matches the order the sentinels appear in. Two separate passes
  // stashed every comment first and every string second while the sentinels stayed interleaved,
  // which spliced doc comments into the middle of code lines. `#` starts a comment only when not
  // followed by `[`, so Rust attributes survive.
  out = out.replace(
    /(\/\/[^\n]*|#(?!\[)[^\n]*|\/\*[\s\S]*?\*\/)|((&quot;|&#39;|`)(?:\\.|(?!\3)[^\\])*\3)/g,
    (m, comment, string) => keep(comment
      ? '<span class="c">' + comment + '</span>'
      : '<span class="s">' + string + '</span>'));
  out = out.replace(KW, '<span class="k">$&</span>');
  out = out.replace(/\b\d[\d_.]*\b/g, '<span class="n">$&</span>');
  out = out.replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="f">$1</span>');
  let i = 0;
  return out.replace(/\uE000/g, () => stash[i++]);
}

// ── editor ───────────────────────────────────────────────────────────────────
function renderTabs() {
  el('tabs').innerHTML = '';
  for (const t of tabs) {
    const node = $('<div class="tab ' + (t.path === active ? 'on' : '') + '"><span>' +
      esc(t.path.split('/').pop()) + '</span>' +
      (t.dirty ? '<span class="dirty" title="unsaved"></span>' : '<span class="x">&times;</span>') +
      '</div>').firstElementChild;
    node.onclick = e => {
      if (e.target.classList.contains('x')) { closeTab(t.path); return; }
      active = t.path; paint();
    };
    el('tabs').append(node);
  }
}
function closeTab(path) {
  const i = tabs.findIndex(t => t.path === path);
  if (i < 0) return;
  tabs.splice(i, 1);
  if (active === path) active = tabs.at(-1)?.path ?? null;
  paint();
}
async function open(path) {
  if (!tabs.some(t => t.path === path)) {
    const r = await fetch('/api/file?path=' + encodeURIComponent(path));
    if (!r.ok) { el('surface').innerHTML = '<div class="empty">' + esc(await r.text()) + '</div>'; return; }
    const f = await r.json();
    tabs.push({ path, content: f.content, dirty: false, truncated: f.truncated });
  }
  active = path; paint();
}

function paint() {
  renderTabs();
  document.querySelectorAll('.tnode').forEach(n => n.classList.toggle('sel', n.dataset.p === active));
  const tab = tabs.find(t => t.path === active);
  if (!tab) {
    el('fmeta').textContent = '';
    el('surface').innerHTML = '<div class="empty">Open a file &mdash; press &#8984;P</div>';
    return;
  }
  if (mode === 'diff') { paintDiff(tab); return; }

  const lines = tab.content.split('\n');
  el('fmeta').textContent = tab.path + ' · ' + lines.length + ' lines' + (tab.truncated ? ' · truncated' : '');
  el('surface').innerHTML =
    '<div class="lines"><div class="ln-row"><div class="ln-no" id="gutter"></div>' +
    '<div class="ln-src"><div class="edit-wrap"><div class="hl" id="hl"></div>' +
    '<textarea id="ta" spellcheck="false"></textarea></div></div></div></div>';

  const repaint = text => {
    el('hl').innerHTML = hl(text) + '\n';
    el('gutter').innerHTML = text.split('\n').map((_, i) => i + 1).join('<br>');
  };
  repaint(tab.content);
  const ta = el('ta');
  ta.value = tab.content;
  ta.oninput = () => { tab.content = ta.value; tab.dirty = true; repaint(ta.value); renderTabs(); };
}

async function paintDiff(tab) {
  const d = await (await fetch('/api/git/diff?path=' + encodeURIComponent(tab.path))).json();
  el('fmeta').textContent = tab.path + ' · ' + (d.untracked ? 'new file' : 'diff');
  if (!d.hunks.length) {
    el('surface').innerHTML = '<div class="empty">No uncommitted changes in this file.</div>';
    return;
  }
  const mk = k => k === 'add' ? '+' : k === 'del' ? '-' : ' ';
  el('surface').innerHTML = '<div class="diff">' + d.hunks.map(h =>
    '<div class="hunk">' + esc(h.header) + '</div>' + h.lines.map(l =>
      '<div class="dline ' + l.kind + '"><div class="dno">' + (l.old ?? '') + '</div>' +
      '<div class="dno">' + (l.new ?? '') + '</div><div class="dsrc"><span class="mk">' +
      mk(l.kind) + '</span>' + (hl(l.text) || '&nbsp;') + '</div></div>').join('')).join('') + '</div>';
}

async function save() {
  const tab = tabs.find(t => t.path === active);
  if (!tab || !tab.dirty) return;
  const r = await fetch('/api/save', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ path: tab.path, content: tab.content }) });
  if (r.ok) { tab.dirty = false; renderTabs(); refresh(); }
}
function syncMode() {
  el('m-src').setAttribute('aria-current', mode === 'src');
  el('m-diff').setAttribute('aria-current', mode === 'diff');
}
el('m-src').onclick = () => { mode = 'src'; syncMode(); paint(); };
el('m-diff').onclick = () => { mode = 'diff'; syncMode(); paint(); };

function treeNode(n, depth) {
  const pad = 14 + depth * 11;
  if (!n.dir) {
    const e = $('<div class="tnode" style="padding-left:' + (pad + 15) + 'px" data-p="' +
      esc(n.path) + '">' + esc(n.name) + '</div>').firstElementChild;
    e.onclick = () => open(n.path);
    return e;
  }
  const wrap = document.createElement('div');
  const collapsed = depth > 0;
  const head = $('<div class="tnode" style="padding-left:' + pad + 'px"><span class="caret">' +
    (collapsed ? '&#9656;' : '&#9662;') + '</span>' + esc(n.name) + '</div>').firstElementChild;
  const kids = document.createElement('div');
  kids.className = 'tkids' + (collapsed ? ' collapsed' : '');
  for (const c of n.children ?? []) kids.append(treeNode(c, depth + 1));
  head.onclick = () => {
    kids.classList.toggle('collapsed');
    head.querySelector('.caret').innerHTML = kids.classList.contains('collapsed') ? '&#9656;' : '&#9662;';
  };
  wrap.append(head, kids);
  return wrap;
}
const flatten = (nodes, out = []) => {
  for (const n of nodes) n.dir ? flatten(n.children ?? [], out) : out.push(n.path);
  return out;
};

// ── chat ─────────────────────────────────────────────────────────────────────
let stream = null, sessionId = null, live = null, permMode = 'acceptEdits';
const log = () => el('log');

const MODES = {
  plan: { note: 'Plan — Claude explores and proposes, and will not edit files or run commands.' },
  acceptEdits: { note: 'Auto — Claude edits files and runs commands here without asking.' },
};
function setPermMode(m) {
  permMode = m;
  el('pm-plan').setAttribute('aria-current', m === 'plan');
  el('pm-auto').setAttribute('aria-current', m === 'acceptEdits');
  const note = el('mode-note');
  note.className = 'mode-note ' + (m === 'plan' ? 'plan' : 'auto');
  note.textContent = MODES[m].note;
}
el('pm-plan').onclick = () => setPermMode('plan');
el('pm-auto').onclick = () => setPermMode('acceptEdits');

function push(html) {
  const n = $(html).firstElementChild;
  log().append(n);
  log().scrollTop = log().scrollHeight;
  return n;
}
function running(on) {
  el('send').disabled = on;
  el('stop').classList.toggle('hidden', !on);
  el('chat-meta').textContent = on ? 'working…' : '';
}

/** Render one stream-json record. The browser interprets the shape, so there is one place to change. */
function record(r) {
  if (r.type === 'system' && r.subtype === 'init') {
    sessionId = r.session_id ?? sessionId;
    el('hint').textContent = (r.model ?? '') + ' · ' + (sessionId ?? '').split('-')[0];
    return;
  }
  const d = r.event?.delta;
  if (r.type === 'stream_event' && d?.type === 'text_delta') {
    if (!live || live.dataset.kind !== 'text') {
      live = push('<div class="msg"><div class="who">Claude</div><div class="txt" data-kind="text"></div></div>')
        .querySelector('.txt');
      live.dataset.raw = '';
    }
    live.dataset.raw += d.text;
    live.innerHTML = md(live.dataset.raw);
    log().scrollTop = log().scrollHeight;
    return;
  }
  if (r.type === 'stream_event' && d?.type === 'thinking_delta') {
    if (!live || live.dataset.kind !== 'think') live = push('<div class="think" data-kind="think"></div>');
    live.textContent += d.thinking;
    return;
  }
  if (r.type === 'assistant') {
    for (const b of r.message?.content ?? []) {
      if (b.type !== 'tool_use') continue;
      live = null;
      const i = b.input ?? {};
      // The full argument gets its own wrapping block. A shell command clipped to one line is
      // unreadable, and the command is exactly what you need to see.
      const detail = i.command ?? i.file_path ?? i.path ?? i.pattern ?? i.prompt ?? '';
      const subtitle = i.description ?? (i.file_path ? '' : i.pattern ? 'search' : '');
      push('<div class="tool"><div class="th"><span class="tn">' + esc(b.name) + '</span>' +
        '<span class="tsub">' + esc(subtitle) + '</span></div>' +
        (detail ? '<pre>' + esc(String(detail)) + '</pre>' : '') + '</div>');
    }
    return;
  }
  if (r.type === 'result') {
    live = null;
    sessionId = r.session_id ?? sessionId;
    el('hint').textContent = (r.total_cost_usd != null ? '$' + r.total_cost_usd.toFixed(4) : '') +
      ' · ' + (sessionId ?? '').split('-')[0];
    // The agent has just changed the tree, the open files and the score.
    refresh();
    for (const t of tabs) if (!t.dirty) reload(t);
  }
}

async function reload(tab) {
  const r = await fetch('/api/file?path=' + encodeURIComponent(tab.path));
  if (!r.ok) return;
  tab.content = (await r.json()).content;
  if (tab.path === active) paint();
}

function send() {
  const box = el('prompt');
  const prompt = box.value.trim();
  if (!prompt || stream) return;
  log().querySelector('.empty')?.remove();
  push('<div class="msg user"><div class="who">You</div><div class="txt">' + esc(prompt) + '</div></div>');
  box.value = ''; live = null; running(true);

  stream = new EventSource('/api/chat?prompt=' + encodeURIComponent(prompt) +
    '&mode=' + encodeURIComponent(permMode) +
    (sessionId ? '&session=' + encodeURIComponent(sessionId) : ''));
  stream.addEventListener('msg', e => { try { record(JSON.parse(e.data)); } catch (_) {} });
  stream.addEventListener('fatal', e =>
    push('<div class="msg"><div class="who">Error</div><div class="txt">' + esc(e.data) + '</div></div>'));
  const end = () => { if (stream) { stream.close(); stream = null; running(false); } };
  stream.addEventListener('done', end);
  stream.onerror = end;
}
el('send').onclick = send;
el('stop').onclick = () => { if (stream) { stream.close(); stream = null; running(false); } };
el('prompt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
});

// ── palette ──────────────────────────────────────────────────────────────────
let palIdx = 0, palHits = [];
function openPal() { el('pal').classList.remove('hidden'); el('pal-q').value = ''; el('pal-q').focus(); palFilter(''); }
function closePal() { el('pal').classList.add('hidden'); }
function palFilter(q) {
  const needle = q.toLowerCase();
  // Subsequence match, the way an editor's file finder behaves: "khtr" finds keel-harness/trust.rs.
  palHits = flat.filter(p => {
    const s = p.toLowerCase();
    let i = 0;
    for (const ch of needle) { i = s.indexOf(ch, i) + 1; if (i === 0) return false; }
    return true;
  }).slice(0, 60);
  palIdx = 0; renderPal();
}
function renderPal() {
  el('pal-res').innerHTML = palHits.map((p, i) =>
    '<div class="r ' + (i === palIdx ? 'on' : '') + '" data-i="' + i + '">' + esc(p) + '</div>').join('');
  el('pal-res').querySelectorAll('.r').forEach(r =>
    r.onclick = () => { open(palHits[+r.dataset.i]); closePal(); });
  el('pal-res').querySelector('.on')?.scrollIntoView({ block: 'nearest' });
}
el('pal-q').oninput = e => palFilter(e.target.value);
el('pal-q').onkeydown = e => {
  if (e.key === 'ArrowDown') { palIdx = Math.min(palIdx + 1, palHits.length - 1); renderPal(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { palIdx = Math.max(palIdx - 1, 0); renderPal(); e.preventDefault(); }
  if (e.key === 'Enter' && palHits[palIdx]) { open(palHits[palIdx]); closePal(); }
  if (e.key === 'Escape') closePal();
};
addEventListener('keydown', e => {
  const cmd = e.metaKey || e.ctrlKey;
  if (cmd && e.key === 'p') { e.preventDefault(); openPal(); }
  if (cmd && e.key === 's') { e.preventDefault(); save(); }
  if (e.key === 'Escape') closePal();
});

function badge(name, n, show) {

async function loadConn() {

async function refresh() {
  [state, git, tree] = await Promise.all([
    fetch('/api/state').then(r => r.json()),
    fetch('/api/git/status').then(r => r.json()),
    fetch('/api/tree').then(r => r.json()),
  ]);
  flat = flatten(tree);
  const blocking = state.scan.findings.filter(f => f.severity === 'critical' || f.severity === 'high').length;
  badge('changes', git.changes?.length ?? 0, (git.changes?.length ?? 0) > 0);
  badge('sessions', state.workspace.sessions.length, state.workspace.sessions.length > 0);
  badge('readiness', blocking, blocking > 0);
  PANELS[panel]();
}

setPermMode('acceptEdits');
(async () => {
  await loadConn();
  await refresh();
  const qs = new URLSearchParams(location.search);
  if (qs.get('panel')) setPanel(qs.get('panel'));
  if (qs.get('mode') === 'diff') { mode = 'diff'; syncMode(); }
  if (qs.get('file')) open(qs.get('file'));
})();
</script>
