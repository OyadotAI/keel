function syncSave(){
  const tab=tabs.find(t=>t.path===active);
  el('do-save').classList.toggle('hidden',!tab?.dirty||view!=='src');
}

function drawStatus(){
  syncSave();
  const s=state?.scan, tab=tabs.find(t=>t.path===active);
  const band=n=>n>=90?'ok':n>=60?'warn':'crit';
  const cells=[];
  if(git?.is_repo) cells.push('<button class="cell" data-go="changes"><b>⑂</b>'+esc(git.branch??'')+'</button>');
  if(git?.changes?.length) cells.push('<button class="cell" data-go="changes">'+git.changes.length+' changed</button>');
  if(s) cells.push('<button class="cell" data-go="readiness">ready <span class="score '+band(s.score)+'">'+s.score+'</span>/100</button>');
  cells.push('<span class="sp"></span>');
  if(mon&&view==='src'&&tab){
    const p=mon.getPosition();
    if(p) cells.push('<span class="cell">'+p.lineNumber+':'+p.column+'</span>');
  }
  if(tab?.dirty) cells.push('<span class="cell">unsaved</span>');
  cells.push('<span class="cell">'+MODE_LABEL[permMode]+'</span>');
  if(stream) cells.push('<span class="cell live">working…</span>');
  if(cost!=null) cells.push('<span class="cell">$'+cost.toFixed(4)+'</span>');
  if(sessionId) cells.push('<span class="cell">'+esc(sessionId.split('-')[0])+'</span>');
  el('status').innerHTML=cells.join('');
  el('status').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setPanel(b.dataset.go));
}

/* ════ command palette ═══════════════════════════════════════════════════
   Scoring follows the fzf/VS Code consensus: hard bands so an exact or prefix
   match always outranks a fuzzy one, then position bonuses (start of string >
   after a separator > mid-word) and a contiguity bonus that is front-loaded so
   long runs cannot dominate. Recency breaks ties, via a monotonic counter rather
   than a clock. */
const recent=new Map(); let useCount=0;

function score(text,q){
  if(!q) return 1;
  const t=text.toLowerCase(), n=q.toLowerCase();
  const idx=t.indexOf(n);
  if(idx===0) return 1e6;                                    // prefix
  if(idx>0) return 1e5 - idx;                                // substring
  let i=0,pts=0,run=0;
  for(const ch of n){
    const at=t.indexOf(ch,i);
    if(at<0) return 0;                                       // not a subsequence
    const prev=at>0?t[at-1]:'';
    if(at===0) pts+=8; else if(prev==='/'||prev==='-'||prev==='_'||prev==='.') pts+=5;
    else if(prev===' ') pts+=4;
    run = at===i ? run+1 : 0;
    pts += run<3 ? run*2 : 3;                                // front-loaded contiguity
    i=at+1;
  }
  return pts;
}

const COMMANDS=[
  {id:'files',      label:'View: Files',        run:()=>setPanel('files'),      key:MAC?'⌘B':'Ctrl+B'},
  {id:'changes',    label:'View: Changes',      run:()=>setPanel('changes')},
  {id:'skills',     label:'View: Skills',       run:()=>setPanel('skills')},
  {id:'readiness',  label:'View: Readiness',    run:()=>setPanel('readiness')},
  {id:'connections',label:'View: Connections',  run:()=>setPanel('connections')},
  {id:'save',       label:'File: Save',         run:save, key:MAC?'⌘S':'Ctrl+S'},
  {id:'close',      label:'File: Close tab',    run:()=>active&&closeTab(active), key:MAC?'⌘K W':'Ctrl+K W'},
  {id:'src',        label:'Editor: Show source', run:()=>{view='src';syncView();draw();}},
  {id:'diff',       label:'Editor: Show diff',  run:()=>{view='diff';syncView();draw();}},
  {id:'plan',       label:'Agent: Plan mode',   run:()=>setMode('plan'),        key:'⇧⇥'},
  {id:'auto',       label:'Agent: Auto mode',   run:()=>setMode('acceptEdits'), key:'⇧⇥'},
  {id:'clearchat',  label:'Agent: Clear conversation', run:()=>el('a-clear').click()},
  {id:'togglechat', label:'View: Toggle agent panel',  run:toggleChat, key:MAC?'⌃`':'Ctrl+`'},
  {id:'toggleside', label:'View: Toggle sidebar',      run:toggleSide, key:MAC?'⌘B':'Ctrl+B'},
  {id:'refresh',    label:'Repository: Refresh',       run:refresh},
];

let hits=[], cursor=0;
function openPal(prefix){
  el('pal').classList.remove('hidden'); el('scrim').classList.remove('hidden');
  el('pq').value=prefix??''; el('pq').focus(); filter();
}
function closePal(){ el('pal').classList.add('hidden'); el('scrim').classList.add('hidden'); }
el('scrim').onclick=closePal;

function filter(){
  const raw=el('pq').value;
  const mode=raw[0]==='>'?'cmd':raw[0]===':'?'line':raw[0]==='?'?'help':'file';
  const q=mode==='file'?raw:raw.slice(1);
  el('pq').placeholder=mode==='cmd'?'Run a command…':mode==='line'?'Go to line…':'Go to file…';

  if(mode==='help'){
    hits=[{label:'>  run a command'},{label:':  go to a line'},{label:'   type to find a file'}];
  } else if(mode==='line'){
    hits=[{label:'Go to line '+(q||'…'),line:parseInt(q,10)}];
  } else if(mode==='cmd'){
    hits=COMMANDS.map(c=>({...c,_s:score(c.label,q)})).filter(c=>c._s>0)
      .sort((a,b)=>b._s-a._s||(recent.get(b.id)??0)-(recent.get(a.id)??0)).slice(0,50);
  } else {
    hits=files.map(p=>({label:p,path:p,_s:score(p,q)})).filter(x=>x._s>0)
      .sort((a,b)=>b._s-a._s||(recent.get(b.path)??0)-(recent.get(a.path)??0)).slice(0,50);
  }
  cursor=0; drawHits();
}
function drawHits(){
  el('hits').innerHTML=hits.map((h,i)=>{
    const name=h.path?h.path.split('/').pop():h.label;
    const dir=h.path?h.path.slice(0,-name.length):'';
    return '<div class="hit'+(i===cursor?' on':'')+'" data-i="'+i+'">'+
      '<span>'+esc(name)+'</span>'+(dir?'<span class="dim">'+esc(dir)+'</span>':'')+
      '<span class="sp"></span>'+(h.key?'<kbd>'+esc(h.key)+'</kbd>':'')+'</div>';
  }).join('');
  el('hits').querySelectorAll('.hit').forEach(n=>n.onclick=()=>choose(+n.dataset.i));
  el('hits').querySelector('.on')?.scrollIntoView({block:'nearest'});
}
function choose(i){
  const h=hits[i]; if(!h) return;
  closePal();
  if(h.path){ recent.set(h.path,++useCount); open(h.path); }
  else if(h.run){ recent.set(h.id,++useCount); h.run(); }
  else if(h.line){ /* line jump lands in a future editor navigation pass */ }
}
el('pq').oninput=filter;
el('pq').onkeydown=e=>{
  if(e.key==='ArrowDown'){ cursor=Math.min(cursor+1,hits.length-1); drawHits(); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ cursor=Math.max(cursor-1,0); drawHits(); e.preventDefault(); }
  else if(e.key==='Enter'){ choose(cursor); e.preventDefault(); }
  else if(e.key==='Escape'){ closePal(); }
};

/* ════ layout ════════════════════════════════════════════════════════════ */
function toggleSide(){ el('app').classList.toggle('no-side'); }
function toggleChat(){ el('app').classList.toggle('no-chat'); }

function wireResize(handle,varName,key,min,max,fromRight){
  if(!handle) return;
  const saved=localStorage.getItem(key);
  if(saved) document.documentElement.style.setProperty(varName,saved+'px');
  handle.addEventListener('pointerdown',e=>{
    e.preventDefault(); handle.setPointerCapture(e.pointerId); handle.classList.add('on');
    const move=ev=>{
      const raw=fromRight?innerWidth-ev.clientX:ev.clientX-48;
      const w=Math.max(min,Math.min(max,raw));
      document.documentElement.style.setProperty(varName,w+'px');
      localStorage.setItem(key,String(w));
    };
    const up=()=>{ handle.classList.remove('on');
      removeEventListener('pointermove',move); removeEventListener('pointerup',up); };
    addEventListener('pointermove',move); addEventListener('pointerup',up);
  });
}

/* Keybindings. ⌘W/⌘T/⌘N/⌘L and friends are reserved by the browser and cannot be
   intercepted, so anything that would collide is routed through a ⌘K chord — the one
   mechanism browsers structurally cannot reserve, and already familiar from VS Code. */
let chord=false;
addEventListener('keydown',e=>{
  const cmd=MAC?e.metaKey:e.ctrlKey;
  const typing=/^(INPUT|TEXTAREA)$/.test(e.target.tagName);

  if(chord){
    chord=false;
    if(e.key==='w'){ e.preventDefault(); active&&closeTab(active); return; }
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();
      const i=tabs.findIndex(t=>t.path===active);
      const j=e.key==='ArrowRight'?i+1:i-1;
      if(tabs[j]){ active=tabs[j].path; draw(); }
      return;
    }
  }
  if(cmd&&e.key==='k'&&!e.shiftKey){ e.preventDefault(); chord=true; return; }
  if(cmd&&e.shiftKey&&(e.key==='p'||e.key==='P')){ e.preventDefault(); openPal('>'); return; }
  if(cmd&&e.key==='p'){ e.preventDefault(); openPal(); return; }
  if(cmd&&e.key==='s'){ e.preventDefault(); save(); return; }
  if(cmd&&e.key==='b'){ e.preventDefault(); toggleSide(); return; }
  if(e.ctrlKey&&e.key==='`'){ e.preventDefault(); toggleChat(); return; }
  // ⌘, is Chrome's own preferences on macOS and cannot be taken, so settings uses ⌘⇧,
  if(cmd&&e.key===','&&(!MAC||e.shiftKey)){ e.preventDefault(); openSettings(); return; }

  // Shift+Tab cycles agent mode — the same gesture Claude Code and Cursor both use.
  if(e.key==='Tab'&&e.shiftKey&&!typing){
    e.preventDefault(); setMode(permMode==='plan'?'acceptEdits':'plan'); return;
  }
  if(e.key==='Escape'){
    if(!el('pal').classList.contains('hidden')){ closePal(); return; }
    if(stream){ el('stop').click(); return; }   // soft interrupt, matching Claude Code
  }
});

/* ════ boot ══════════════════════════════════════════════════════════════ */
function badge(name,n,alert){
  const b=document.querySelector('[data-b="'+name+'"]'); if(!b) return;
  b.textContent=n; b.classList.toggle('hidden',!n);
  b.classList.toggle('alert',!!alert);
}
async function loadConn(){
  conn=await (await fetch('/api/connections')).json();
  badge('conn','!',!conn.github||!conn.cloudflare||!conn.claude);
}
async function refresh(){
  [state,git,treeData]=await Promise.all([
    fetch('/api/state').then(r=>r.json()),
    fetch('/api/git/status').then(r=>r.json()),
    fetch('/api/tree').then(r=>r.json()),
  ]);
  files=flatten(treeData);
  const blocking=state.scan.findings.filter(f=>f.severity==='critical'||f.severity==='high').length;
  badge('changes',git.changes?.length??0,false);
  badge('ready',blocking,blocking>0);
  PANELS[panel]();
  el('side').append(frag('<div class="rz left" id="rz1"></div>'));
  wireResize(el('rz1'),'--side','keel.side',190,540,false);
  drawStatus();
}

wireResize(el('rz2'),'--chat','keel.chat',300,760,true);
(async()=>{
  await Promise.all([loadConn(), loadClis()]);
  await refresh();
  PANELS._skillsCta?.();
  emptyLog();   // suggestions are drawn from the scan and git status, so it waits for them
  draw();
  const qs=new URLSearchParams(location.search);
  if(qs.get('panel')) setPanel(qs.get('panel'));
  if(qs.get('mode')==='diff'){ view='diff'; syncView(); }
  if(qs.get('file')) open(qs.get('file'));
  // ?ask= sends a prompt on load, so a finding or a review link can open straight into a question.
  if(qs.get('ask')) send(qs.get('ask'));
  if(qs.get('settings')){ setsTab=qs.get('settings'); openSettings(); }
})();
