<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel</title>
<style>
  :root {
    --bg: #0d1117; --panel: #12181f; --panel-2: #161d26; --line: #232c38;
    --text: #e3e8ef; --dim: #8b98a9; --faint: #5c6774;
    --accent: #4cc2ff; --crit: #ff6b6b; --high: #ffa657; --med: #e3c565; --low: #7d8ba1;
    --ok: #56d364;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f8fa; --panel: #fff; --panel-2: #f0f3f6; --line: #d8dee6;
      --text: #1c2128; --dim: #57606a; --faint: #8b949e;
      --accent: #0969da; --crit: #cf222e; --high: #bc4c00; --med: #9a6700; --low: #6e7781;
      --ok: #1a7f37;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-columns: 232px 260px 1fr 420px; height: 100vh; overflow: hidden; }
  @media (max-width: 1500px) { .app { grid-template-columns: 200px 220px 1fr 380px; } }

  /* file tree */
  .tree-pane { background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 12px 0; }
  .pane-title { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--faint); font-weight: 600; padding: 0 14px 8px; }
  .tnode { display: flex; align-items: center; gap: 6px; padding: 3px 14px; cursor: pointer;
    font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; font-family: var(--mono); }
  .tnode:hover { background: var(--panel-2); color: var(--text); }
  .tnode.sel { background: var(--panel-2); color: var(--accent); }
  .tnode .caret { width: 9px; flex: none; color: var(--faint); font-size: 9px; }
  .tkids.collapsed { display: none; }

  /* editor */
  .editor-pane { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
  .tabbar { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 38px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
  .tabbar .fname { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
  .tabbar .meta { font-size: 11px; color: var(--faint); margin-left: auto; }
  .code { flex: 1; overflow: auto; margin: 0; padding: 14px 0; }
  .code table { border-collapse: collapse; width: 100%; }
  .code td { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; vertical-align: top; }
  .code td.ln { text-align: right; color: var(--faint); user-select: none;
    width: 1%; padding: 0 14px 0 16px; white-space: nowrap; }
  .code td.src { white-space: pre-wrap; word-break: break-word; padding-right: 20px; }
  .k { color: #c678dd; } .s { color: #98c379; } .c { color: var(--faint); font-style: italic; }
  .n { color: #d19a66; } .f { color: #61afef; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .k { color: #a626a4; }
    :root:not([data-theme="dark"]) .s { color: #50a14f; }
    :root:not([data-theme="dark"]) .n { color: #986801; }
    :root:not([data-theme="dark"]) .f { color: #4078f2; } }

  /* chat */
  .chat-pane { background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden; }
  .chat-head { padding: 11px 16px; border-bottom: 1px solid var(--line); flex: none;
    display: flex; align-items: center; gap: 9px; }
  .chat-head b { font-size: 13px; font-weight: 600; }
  .chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex;
    flex-direction: column; gap: 14px; }
  .msg { font-size: 13px; line-height: 1.6; }
  .msg.user { background: var(--panel-2); border-radius: 9px; padding: 10px 13px; }
  .msg.user .who { color: var(--accent); }
  .who { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--faint); font-weight: 600; margin-bottom: 5px; }
  .msg .txt { white-space: pre-wrap; word-break: break-word; }
  .tool { display: flex; gap: 8px; align-items: baseline; font-family: var(--mono);
    font-size: 11.5px; color: var(--dim); padding: 5px 9px; background: var(--panel-2);
    border-radius: 6px; border-left: 2px solid var(--accent); }
  .tool .tn { color: var(--accent); font-weight: 600; }
  .tool .ta { color: var(--faint); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .chat-input { border-top: 1px solid var(--line); padding: 12px; flex: none; }
  .chat-input textarea { width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 10px 12px; font: 13px/1.5 var(--sans);
    resize: none; min-height: 66px; outline: none; }
  .chat-input textarea:focus { border-color: var(--accent); }
  .chat-foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .chat-foot .hint { font-size: 11px; color: var(--faint); margin-right: auto; }
  .btn { all: unset; background: var(--accent); color: #fff; padding: 6px 15px;
    border-radius: 7px; font-size: 12.5px; font-weight: 560; cursor: pointer; }
  .btn:hover { filter: brightness(1.1); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn.ghost { background: var(--panel-2); color: var(--dim); }
  .perm { font-size: 11px; color: var(--high); padding: 7px 16px;
    background: color-mix(in srgb, var(--high) 10%, transparent);
    border-bottom: 1px solid var(--line); flex: none; }

  /* inspector slide-over */
  .drawer { position: fixed; inset: 0 0 0 auto; width: min(880px, 78vw); background: var(--bg);
    border-left: 1px solid var(--line); z-index: 20; overflow-y: auto;
    box-shadow: -24px 0 60px rgba(0,0,0,.30); }
  .drawer.hidden { display: none; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 19; }
  .scrim.hidden { display: none; }
  .drawer-close { position: absolute; top: 18px; right: 22px; }

  /* ── rail ── */
  .rail { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 0; }
  .brand {
    display: flex; align-items: center; gap: 9px; padding: 0 18px 18px;
    font-weight: 620; letter-spacing: -.01em; font-size: 15px;
  }
  .mark { width: 20px; height: 20px; flex: none; }
  .repo {
    padding: 0 18px 18px; font-family: var(--mono); font-size: 11.5px;
    color: var(--dim); word-break: break-all; line-height: 1.45;
  }
  nav { display: flex; flex-direction: column; gap: 1px; padding: 0 10px; }
  nav button {
    all: unset; display: flex; justify-content: space-between; align-items: center;
    padding: 7px 10px; border-radius: 6px; cursor: pointer; color: var(--dim);
    font-size: 13px; transition: background .12s, color .12s;
  }
  nav button:hover { background: var(--panel-2); color: var(--text); }
  nav button[aria-current="true"] { background: var(--panel-2); color: var(--text); font-weight: 560; }
  nav .n { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  nav .n.warn { color: var(--crit); }

  .conns { margin-top: 22px; padding: 14px 18px 0; border-top: 1px solid var(--line); }
  .conns h4 { margin: 0 0 9px; font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--faint); font-weight: 600; }
  .conn { display: flex; align-items: center; gap: 7px; padding: 3px 0;
    font-size: 12px; color: var(--dim); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--ok); }

  /* ── main ── */
  main { padding: 26px 30px 60px; max-width: 1000px; }
  .head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  h1 { font-size: 19px; margin: 0; font-weight: 620; letter-spacing: -.015em; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 24px; }

  /* score */
  .score-row { display: flex; align-items: center; gap: 22px; margin-bottom: 26px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; }
  .score { font-family: var(--mono); font-size: 40px; font-weight: 600;
    line-height: 1; letter-spacing: -.03em; }
  .score small { font-size: 15px; color: var(--faint); font-weight: 400; }
  .verdict { font-size: 14px; font-weight: 560; margin-bottom: 3px; }
  .bar { height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden;
    margin-top: 11px; width: 260px; }
  .bar i { display: block; height: 100%; border-radius: 3px; transition: width .5s ease; }

  .sect { margin-bottom: 26px; }
  .sect h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); font-weight: 600; margin: 0 0 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; }
  .row { display: flex; gap: 13px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .sev { font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: .05em; padding: 2.5px 7px; border-radius: 4px; height: fit-content;
    flex: none; width: 62px; text-align: center; font-weight: 600; }
  .sev.critical { color: var(--crit); background: color-mix(in srgb, var(--crit) 14%, transparent); }
  .sev.high { color: var(--high); background: color-mix(in srgb, var(--high) 14%, transparent); }
  .sev.medium { color: var(--med); background: color-mix(in srgb, var(--med) 14%, transparent); }
  .sev.low, .sev.info { color: var(--low); background: color-mix(in srgb, var(--low) 14%, transparent); }
  .body { min-width: 0; flex: 1; }
  .title { font-weight: 545; margin-bottom: 3px; }
  .title code { font-family: var(--mono); font-size: 12.5px;
    background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  .detail { color: var(--dim); font-size: 12.5px; margin-bottom: 7px; }
  .fix { font-size: 12.5px; color: var(--dim); display: flex; gap: 7px; }
  .fix b { color: var(--accent); font-weight: 560; flex: none; }
  .path { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }

  /* lists */
  .item { display: grid; grid-template-columns: 1fr auto; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .item:last-child { border-bottom: 0; }
  /* Grid children default to min-width:auto, so a long nowrap description refuses to shrink and
     pushes the scope tag off the edge. This is what lets the ellipsis engage instead. */
  .item > div:first-child { min-width: 0; }
  .item .nm { font-family: var(--mono); font-size: 12.5px; font-weight: 550; }
  .item .ds { color: var(--dim); font-size: 12.5px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 4px;
    background: var(--panel-2); color: var(--faint); white-space: nowrap; }
  .tag.project { color: var(--high); background: color-mix(in srgb, var(--high) 13%, transparent); }
  .danger { border-left: 2px solid var(--crit); }
  .danger .nm::before { content: "! "; color: var(--crit); font-weight: 700; }

  .warn-banner { display: flex; gap: 11px; padding: 13px 16px; border-radius: 9px;
    background: color-mix(in srgb, var(--crit) 9%, transparent);
    border: 1px solid color-mix(in srgb, var(--crit) 28%, transparent); margin-bottom: 14px; }
  .warn-banner b { color: var(--crit); }
  .warn-banner code { font-family: var(--mono); font-size: 12px;
    background: var(--panel-2); padding: 1px 6px; border-radius: 4px; }

  .empty { padding: 30px 16px; text-align: center; color: var(--faint); font-size: 13px; }
  .pane-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 17px 18px; }
  .pane h3 { margin: 0 0 3px; font-size: 13px; font-weight: 600; }
  .pane .st { font-size: 12.5px; color: var(--faint); }
  .hidden { display: none; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg class="mark" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M10 1.5v17M10 18.5c-3.6 0-6.4-1.9-7.6-4.3M10 18.5c3.6 0 6.4-1.9 7.6-4.3"
              stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      Keel
    </div>
    <div class="repo" id="repo">…</div>
    <nav id="nav"></nav>
    <div class="conns">
      <h4>Connections</h4>
      <div id="conns"></div>
    </div>
  </aside>

  <aside class="tree-pane">
    <div class="pane-title">Files</div>
    <div id="tree"></div>
  </aside>

  <section class="editor-pane">
    <div class="tabbar">
      <span class="fname" id="fname">No file open</span>
      <span class="meta" id="fmeta"></span>
    </div>
    <div class="code" id="code"><div class="empty">Select a file to view it.</div></div>
  </section>

  <section class="chat-pane">
    <div class="chat-head">
      <span class="dot on"></span><b>Claude Code</b>
      <span class="meta" id="chatstatus" style="margin-left:auto;font-size:11px;color:var(--faint)"></span>
    </div>
    <div class="perm" id="perm">acceptEdits — the agent can edit files and run commands here.</div>
    <div class="chat-log" id="chatlog">
      <div class="empty" style="padding:24px 0">Ask Claude Code to change this repository.</div>
    </div>
    <div class="chat-input">
      <textarea id="prompt" placeholder="Describe a change…  (⌘⏎ to send)"></textarea>
      <div class="chat-foot">
        <span class="hint" id="hint"></span>
        <button class="btn ghost hidden" id="stop">Stop</button>
        <button class="btn" id="send">Send</button>
      </div>
    </div>
  </section>
</div>

<div class="scrim hidden" id="scrim"></div>
<div class="drawer hidden" id="drawer">
  <button class="btn ghost drawer-close" id="drawer-close">Close</button>
  <main id="main"><div class="empty">Loading…</div></main>
</div>

<script>
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Findings and titles wrap identifiers in backticks; render those as code without trusting the rest.
const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');

let state = null;
let tab = (location.hash || '#overview').slice(1);

const TABS = [
  { id: 'overview',  label: 'Overview'  },
  { id: 'findings',  label: 'Readiness' },
  { id: 'sessions',  label: 'Sessions'  },
  { id: 'skills',    label: 'Skills'    },
  { id: 'trust',     label: 'Trust'     },
];

function counts(s) {
  const w = s.workspace;
  return {
    overview: null,
    findings: s.scan.findings.length,
    sessions: w.sessions.length,
    skills: w.skills.length + w.plugins.length + w.agents.length + w.commands.length,
    trust: w.hooks.filter(h => h.scope === 'project').length
         + w.mcp_servers.filter(m => m.scope === 'project').length,
  };
}

function renderNav() {
  const c = counts(state);
  document.getElementById('nav').innerHTML = '';
  for (const t of TABS) {
    const n = c[t.id];
    const warn = t.id === 'trust' && n > 0;
    const el = $(`<button aria-current="${t.id === tab}">
      <span>${t.label}</span>
      ${n === null ? '' : `<span class="n ${warn ? 'warn' : ''}">${n}</span>`}
    </button>`).firstElementChild;
    el.onclick = () => { tab = t.id; openDrawer(); render(); };
    document.getElementById('nav').append(el);
  }
}

function scoreColor(n) {
  return n >= 90 ? 'var(--ok)' : n >= 70 ? 'var(--med)' : n >= 40 ? 'var(--high)' : 'var(--crit)';
}

function findingRow(f) {
  return `<div class="row">
    <span class="sev ${f.severity}">${f.severity}</span>
    <div class="body">
      <div class="title">${md(f.title)}</div>
      <div class="detail">${md(f.detail)}</div>
      ${f.path ? `<div class="path">${esc(f.path)}</div>` : ''}
      <div class="fix"><b>fix</b><span>${esc(f.fix.description)}</span></div>
    </div>
  </div>`;
}

function listCard(items, render, emptyText) {
  if (!items.length) return `<div class="card"><div class="empty">${esc(emptyText)}</div></div>`;
  return `<div class="card">${items.map(render).join('')}</div>`;
}

const views = {
  overview() {
    const s = state.scan, w = state.workspace;
    const top = s.findings.filter(f => f.severity === 'critical' || f.severity === 'high');
    const untrusted = counts(state).trust;
    return `
      <div class="head"><h1>Overview</h1></div>
      <div class="sub">Readiness, and everything Claude Code knows about this repository.</div>

      <div class="score-row">
        <div class="score" style="color:${scoreColor(s.score)}">${s.score}<small>/100</small></div>
        <div>
          <div class="verdict">${s.findings.some(f => ['critical','high'].includes(f.severity))
            ? 'Not ready to deploy' : 'No blocking issues'}</div>
          <div class="detail">${s.findings.length} finding${s.findings.length === 1 ? '' : 's'} ·
            ${s.findings.filter(f => f.fix.kind === 'automatic').length} fixable automatically</div>
          <div class="bar"><i style="width:${s.score}%;background:${scoreColor(s.score)}"></i></div>
        </div>
      </div>

      ${untrusted > 0 ? `<div class="warn-banner">
        <b>!</b><div><b>${untrusted} item${untrusted === 1 ? '' : 's'} came with this repository and will execute.</b>
        Hooks run shell commands at session start and MCP servers connect automatically.
        Review them under Trust, or run <code>keel trust</code> to quarantine them.</div>
      </div>` : ''}

      <div class="sect">
        <h2>Environments</h2>
        <div class="pane-grid">
          <div class="pane"><h3>dev</h3><div class="st">Not connected — no Cloudflare account linked</div></div>
          <div class="pane"><h3>prod</h3><div class="st">Not connected — no Cloudflare account linked</div></div>
        </div>
      </div>

      ${top.length ? `<div class="sect"><h2>Blocking</h2>
        <div class="card">${top.map(findingRow).join('')}</div></div>` : ''}

      <div class="sect">
        <h2>Recent sessions</h2>
        ${listCard(w.sessions.slice(0, 4), s => `<div class="item">
          <div><div class="nm">${esc(s.title ?? '(untitled)')}</div>
            <div class="ds">${s.messages} messages · ${esc((s.last_active ?? '').slice(0, 16).replace('T', ' '))}</div></div>
          <span class="tag">${esc(s.id.split('-')[0])}</span>
        </div>`, 'No sessions recorded for this repository yet.')}
      </div>`;
  },

  findings() {
    const s = state.scan;
    const groups = {};
    for (const f of s.findings) (groups[f.dimension] ??= []).push(f);
    const label = d => d.replace(/-/g, ' ').replace(/^./, c => c.toUpperCase());
    return `
      <div class="head"><h1>Readiness</h1></div>
      <div class="sub">Can an agent safely work here, and can this run on Cloudflare?</div>
      ${s.findings.length === 0
        ? `<div class="card"><div class="empty">Nothing to report. This repository is ready.</div></div>`
        : Object.entries(groups).map(([dim, fs]) => `<div class="sect">
            <h2>${esc(label(dim))}</h2>
            <div class="card">${fs.map(findingRow).join('')}</div>
          </div>`).join('')}`;
  },

  sessions() {
    const w = state.workspace;
    return `
      <div class="head"><h1>Sessions</h1></div>
      <div class="sub">Recorded Claude Code conversations. Titles and counts only — message
        contents never leave the transcript.</div>
      ${listCard(w.sessions, s => `<div class="item">
        <div>
          <div class="nm">${esc(s.title ?? '(untitled)')}</div>
          <div class="ds">${s.messages} messages · ${esc((s.last_active ?? '').slice(0, 16).replace('T', ' '))}
            ${s.branch ? ' · ' + esc(s.branch) : ''}${s.version ? ' · v' + esc(s.version) : ''}</div>
        </div>
        <span class="tag">claude --resume ${esc(s.id.split('-')[0])}</span>
      </div>`, 'No sessions recorded for this repository yet.')}`;
  },

  skills() {
    const w = state.workspace;
    const named = (x) => `<div class="item ${x.scope === 'project' ? '' : ''}">
      <div><div class="nm">${esc(x.name)}</div>
        ${x.description ? `<div class="ds">${esc(x.description)}</div>` : ''}</div>
      <span class="tag ${x.scope}">${esc(x.scope)}</span>
    </div>`;
    return `
      <div class="head"><h1>Skills &amp; extensions</h1></div>
      <div class="sub">What the agent can do here. <code>project</code> means it arrived with the
        repository.</div>
      <div class="sect"><h2>Skills</h2>${listCard(w.skills, named, 'No skills.')}</div>
      <div class="sect"><h2>Plugins</h2>${listCard(w.plugins, p => `<div class="item">
        <div><div class="nm">${esc(p.name)}</div>
          <div class="ds">${esc(p.marketplace ?? '')}</div></div>
        <span class="tag">${esc(p.scope ?? '')}</span></div>`, 'No plugins installed.')}</div>
      <div class="sect"><h2>Subagents</h2>${listCard(w.agents, named, 'No subagents.')}</div>
      <div class="sect"><h2>Commands</h2>${listCard(w.commands, named, 'No custom commands.')}</div>`;
  },

  trust() {
    const w = state.workspace;
    const n = counts(state).trust;
    const row = (x, primary, secondary) => `<div class="item ${x.scope === 'project' ? 'danger' : ''}">
      <div><div class="nm">${esc(primary)}</div>
        <div class="ds">${esc(secondary)}</div></div>
      <span class="tag ${x.scope}">${esc(x.scope)}</span>
    </div>`;
    return `
      <div class="head"><h1>Trust</h1></div>
      <div class="sub">Configuration that executes. Anything marked <code>project</code> was written
        by whoever wrote the repository — not necessarily by you.</div>
      ${n > 0 ? `<div class="warn-banner"><b>!</b><div>
        <b>${n} item${n === 1 ? '' : 's'} will run when a session starts.</b>
        Claude Code loads repository hooks with no trust prompt. Run <code>keel trust</code> to move
        them aside for review.</div></div>` : ''}
      <div class="sect"><h2>Hooks</h2>${listCard(w.hooks,
        h => row(h, h.event, h.command), 'No hooks configured.')}</div>
      <div class="sect"><h2>MCP servers</h2>${listCard(w.mcp_servers,
        m => row(m, m.name, m.endpoint ?? ''), 'No MCP servers configured.')}</div>`;
  },
};

addEventListener('hashchange', () => {
  const next = location.hash.slice(1);
  if (views[next]) { tab = next; render(); }
});

function render() {
  if (!views[tab]) tab = 'overview';
  renderNav();
  document.getElementById('main').innerHTML = views[tab]();
}


// -- inspector drawer --------------------------------------------------------
function openDrawer() {
  document.getElementById('drawer').classList.remove('hidden');
  document.getElementById('scrim').classList.remove('hidden');
}
function closeDrawer() {
  document.getElementById('drawer').classList.add('hidden');
  document.getElementById('scrim').classList.add('hidden');
}
document.getElementById('scrim').onclick = closeDrawer;
document.getElementById('drawer-close').onclick = closeDrawer;
addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

// -- file tree ---------------------------------------------------------------
let openFile = null;

function treeNode(n, depth) {
  const pad = 14 + depth * 11;
  if (!n.dir) {
    const el = $(`<div class="tnode" style="padding-left:${pad + 15}px" data-p="${esc(n.path)}">${esc(n.name)}</div>`).firstElementChild;
    el.onclick = () => loadFile(n.path);
    return el;
  }
  const wrap = document.createElement('div');
  // Collapse nested directories by default so the pane stays scannable on a large repo.
  const collapsed = depth > 0;
  const head = $(`<div class="tnode" style="padding-left:${pad}px">
    <span class="caret">${collapsed ? '▸' : '▾'}</span>${esc(n.name)}</div>`).firstElementChild;
  const kids = document.createElement('div');
  kids.className = 'tkids' + (collapsed ? ' collapsed' : '');
  for (const c of n.children ?? []) kids.append(treeNode(c, depth + 1));
  head.onclick = () => {
    kids.classList.toggle('collapsed');
    head.querySelector('.caret').textContent =
      kids.classList.contains('collapsed') ? '▸' : '▾';
  };
  wrap.append(head, kids);
  return wrap;
}

async function loadTree() {
  const nodes = await (await fetch('/api/tree')).json();
  const host = document.getElementById('tree');
  host.innerHTML = '';
  for (const n of nodes) host.append(treeNode(n, 0));
}

// Minimal highlighter. Deliberately not a parser -- it colours strings, comments, keywords and
// numbers well enough to read code, and gets out of the way when it cannot tell.
const KEYWORDS = /\b(fn|let|mut|pub|use|mod|struct|enum|impl|trait|match|if|else|for|while|loop|return|const|static|async|await|move|where|as|dyn|self|Self|crate|super|type|ref|in|break|continue|unsafe|extern|function|var|class|export|import|from|default|new|try|catch|throw|typeof|instanceof|def|elif|except|lambda|with|yield|None|True|False|null|true|false|undefined)\b/g;

function highlight(src) {
  let out = esc(src);
  const stash = [];
  // A digit-free sentinel. An index-based placeholder gets mangled by the number rule
  // below before it can be restored, which rendered every comment line as a bare number.
  const MARK = '\uE000';
  const keep = (html) => { stash.push(html); return MARK; };
  // Strings and comments first, stashed so keyword matching cannot reach inside them.
  out = out.replace(/\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\//g, m => keep(`<span class="c">${m}</span>`));
  out = out.replace(/(&quot;|&#39;|`)(?:\\.|(?!\1)[^\\])*\1/g, m => keep(`<span class="s">${m}</span>`));
  out = out.replace(KEYWORDS, '<span class="k">$&</span>');
  out = out.replace(/\b\d[\d_.]*\b/g, '<span class="n">$&</span>');
  out = out.replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="f">$1</span>');
  let i = 0;
  return out.replace(/\uE000/g, () => stash[i++]);
}

async function loadFile(path) {
  document.querySelectorAll('.tnode').forEach(e => e.classList.toggle('sel', e.dataset.p === path));
  const r = await fetch('/api/file?path=' + encodeURIComponent(path));
  const code = document.getElementById('code');
  document.getElementById('fname').textContent = path;
  if (!r.ok) {
    document.getElementById('fmeta').textContent = '';
    code.innerHTML = `<div class="empty">${esc(await r.text())}</div>`;
    return;
  }
  const f = await r.json();
  openFile = path;
  const lines = f.content.split('\n');
  document.getElementById('fmeta').textContent =
    `${lines.length} lines${f.truncated ? ' · truncated' : ''}`;
  code.innerHTML = `<table>${lines.map((l, i) =>
    `<tr><td class="ln">${i + 1}</td><td class="src">${highlight(l) || '&nbsp;'}</td></tr>`).join('')}</table>`;
  code.scrollTop = 0;
}

// -- chat --------------------------------------------------------------------
let stream = null, sessionId = null, liveText = null;
const log = document.getElementById('chatlog');

function append(html) {
  const el = $(html).firstElementChild;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function setRunning(on) {
  document.getElementById('send').disabled = on;
  document.getElementById('stop').classList.toggle('hidden', !on);
  document.getElementById('chatstatus').textContent = on ? 'working...' : '';
}

/** Render one stream-json record. The browser interprets the shape so there is one place to change. */
function handleRecord(rec) {
  if (rec.type === 'system' && rec.subtype === 'init') {
    sessionId = rec.session_id ?? sessionId;
    document.getElementById('hint').textContent =
      `${rec.model ?? ''}${sessionId ? ' · ' + sessionId.split('-')[0] : ''}`;
    return;
  }

  // Incremental assistant text.
  if (rec.type === 'stream_event' && rec.event?.delta?.type === 'text_delta') {
    if (!liveText) {
      liveText = append('<div class="msg"><div class="who">Claude</div><div class="txt"></div></div>')
        .querySelector('.txt');
    }
    liveText.textContent += rec.event.delta.text;
    log.scrollTop = log.scrollHeight;
    return;
  }

  if (rec.type === 'assistant') {
    for (const block of rec.message?.content ?? []) {
      if (block.type === 'tool_use') {
        liveText = null;
        const arg = block.input?.file_path ?? block.input?.command ?? block.input?.pattern ?? '';
        append(`<div class="tool"><span class="tn">${esc(block.name)}</span><span class="ta">${esc(arg)}</span></div>`);
      }
    }
    return;
  }

  if (rec.type === 'result') {
    liveText = null;
    sessionId = rec.session_id ?? sessionId;
    const cost = rec.total_cost_usd;
    document.getElementById('hint').textContent =
      (cost != null ? `$${cost.toFixed(4)}` : '') +
      (sessionId ? ` · ${sessionId.split('-')[0]}` : '');
    // The tree and the open file may have changed underneath us.
    loadTree();
    if (openFile) loadFile(openFile);
    loadState();
  }
}

function send() {
  const box = document.getElementById('prompt');
  const prompt = box.value.trim();
  if (!prompt || stream) return;

  log.querySelector('.empty')?.remove();
  append(`<div class="msg user"><div class="who">You</div><div class="txt">${esc(prompt)}</div></div>`);
  box.value = '';
  liveText = null;
  setRunning(true);

  const url = '/api/chat?prompt=' + encodeURIComponent(prompt) +
    (sessionId ? '&session=' + encodeURIComponent(sessionId) : '');
  stream = new EventSource(url);

  stream.addEventListener('msg', e => {
    try { handleRecord(JSON.parse(e.data)); } catch { /* a partial line is not worth surfacing */ }
  });
  stream.addEventListener('fatal', e => {
    append(`<div class="msg"><div class="who">Error</div><div class="txt">${esc(e.data)}</div></div>`);
  });
  stream.addEventListener('done', () => { stream.close(); stream = null; setRunning(false); });
  stream.onerror = () => { if (stream) { stream.close(); stream = null; setRunning(false); } };
}

document.getElementById('send').onclick = send;
document.getElementById('stop').onclick = () => {
  if (stream) { stream.close(); stream = null; setRunning(false); }
};
document.getElementById('prompt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
});

async function loadState() {
  const r = await fetch('/api/state');
  state = await r.json();
  document.getElementById('repo').textContent = state.repo;
  document.getElementById('conns').innerHTML = [
    ['Claude Code', state.connections.claude],
    ['GitHub', state.connections.github],
    ['Cloudflare', state.connections.cloudflare],
  ].map(([n, on]) => `<div class="conn"><span class="dot ${on ? 'on' : ''}"></span>${n}${on ? '' : ' — not connected'}</div>`).join('');
  render();
}

loadState();
loadTree().then(() => {
  // ?file= opens a file directly, which makes a view shareable and a screenshot reproducible.
  const wanted = new URLSearchParams(location.search).get('file');
  if (wanted) loadFile(wanted);
});
</script>
