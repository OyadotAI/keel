<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keel</title>
<style>
/* ════════════════════════════════════════════════════════════════════════════
   Tokens.

   Structure follows Radix/Primer's 12-step model: bg 1–2, component rest/hover/
   pressed 3/4/5, borders 6/7/8, muted text 11, default text 12. Hover is always
   exactly one step past rest — never an opacity hack.

   Elevation is INVERTED, following Zed: the editor is the DARKEST surface and the
   chrome sits forward of it. The usual "elevation means lighter" advice is wrong
   for a tool you read in — the work surface should recede, the frame should not.

   The neutral ramp is warm rather than the blue-grey every editor ships, and every
   value below was checked against WCAG: text ≥4.5:1, borders and focus ≥3:1.
   ════════════════════════════════════════════════════════════════════════════ */
:root {
  --n1:#131211; --n2:#191817; --n3:#1f1e1c; --n4:#252423; --n5:#2b2a28; --n6:#322f2d;
  --n7:#3d3a37; --n8:#65605a; --n9:#736e68; --n10:#8f8a83; --n11:#b3ada5; --n12:#ece9e4;

  /* State. The only saturated colour in the interface. */
  --ok:#4ec26a; --warn:#d9a441; --crit:#e5675f;
  --add:#3fb950; --add-bg:rgba(63,185,80,.12);
  --del:#f85149; --del-bg:rgba(248,81,73,.12);

  /* Interactive accent — deliberately not a state hue, so "clickable" never reads
     as "warning". */
  --accent:#6ea8fe; --accent-dim:rgba(110,168,254,.14);

  /* Syntax. Hue separation is the whole game: the eye should parse token category
     before it reads the word. */
  --syn-key:#c678dd; --syn-str:#98c379; --syn-com:#837c6e; --syn-num:#d19a66;
  --syn-fn:#61afef; --syn-type:#e5c07b; --syn-var:#e06c75;

  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;

  /* The entire spacing vocabulary. No one-off values. */
  --s1:2px; --s2:4px; --s3:8px; --s4:12px; --s5:16px; --s6:24px;
  --r1:4px; --r2:6px; --r3:10px;

  --t-hover:100ms cubic-bezier(.25,.1,.25,1);
  --t-state:200ms cubic-bezier(.6,0,.2,1);
  --t-enter:300ms cubic-bezier(.3,.8,.6,1);

  --side:274px; --chat:412px;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --n1:#ffffff; --n2:#faf9f7; --n3:#f4f2ef; --n4:#ece9e4; --n5:#e4e0da; --n6:#dbd6cf;
  --n7:#cdc7be; --n8:#9a938b; --n9:#8b847a; --n10:#6f6961; --n11:#57524b; --n12:#1c1a18;
  --ok:#157f3b; --warn:#9a6700; --crit:#cf222e;
  --add:#1a7f37; --add-bg:rgba(74,194,107,.15);
  --del:#cf222e; --del-bg:rgba(255,129,130,.17);
  --accent:#0b62d6; --accent-dim:rgba(11,98,214,.10);
  --syn-key:#a626a4; --syn-str:#428441; --syn-com:#7c756d; --syn-num:#986801;
  --syn-fn:#4078f2; --syn-type:#9b6e00; --syn-var:#cf222e;
}}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--n3);color:var(--n12);
  font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}

/* Focus is always visible, always instant. */
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:var(--r1)}

/* Scrollbars stay nearly invisible until touched. */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--n7);border-radius:5px;
  border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--n8);background-clip:content-box}

/* ── shell ──────────────────────────────────────────────────────────────── */
.app{display:grid;height:100vh;
  grid-template-columns:48px var(--side) 1fr var(--chat);
  grid-template-rows:1fr 26px}
.app.no-side{grid-template-columns:48px 0 1fr var(--chat)}
.app.no-chat{grid-template-columns:48px var(--side) 1fr 0}
.app.no-side.no-chat{grid-template-columns:48px 0 1fr 0}

/* Resize handles sit on the panel edge and never move the layout themselves. */
.rz{position:absolute;top:0;bottom:0;width:7px;cursor:col-resize;z-index:6}
.rz::after{content:"";position:absolute;inset:0 3px;background:transparent;
  transition:background var(--t-hover)}
.rz:hover::after,.rz.on::after{background:var(--accent)}
.rz.left{right:-4px} .rz.right{left:-4px}

/* ── activity rail ──────────────────────────────────────────────────────── */
.rail{grid-row:1/3;background:var(--n3);border-right:1px solid var(--n6);
  display:flex;flex-direction:column;align-items:center;padding:var(--s4) 0;gap:var(--s1)}
.rail .mark{color:var(--n11);margin-bottom:var(--s4)}
.ic{all:unset;width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r2);
  cursor:pointer;color:var(--n10);position:relative;transition:color var(--t-hover),
  background var(--t-hover)}
.ic:hover{background:var(--n4);color:var(--n12)}
.ic[aria-current=true]{background:var(--n5);color:var(--n12)}
.ic[aria-current=true]::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;
  width:2px;background:var(--accent);border-radius:1px}
.ic .badge{position:absolute;top:1px;right:1px;min-width:14px;height:14px;padding:0 3px;
  border-radius:7px;background:var(--n7);color:var(--n12);
  font:600 9px/14px var(--mono);font-variant-numeric:tabular-nums;text-align:center}
.ic .badge.alert{background:var(--crit);color:#fff}
.rail .grow{flex:1}

/* ── side panel ─────────────────────────────────────────────────────────── */
.side{grid-row:1/2;background:var(--n3);border-right:1px solid var(--n6);
  overflow:hidden auto;position:relative;min-width:0}
.app.no-side .side{border-right:0}
.ph{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s4) var(--s3);
  position:sticky;top:0;background:var(--n3);z-index:2}
.ph h2{margin:0;font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--n10)}
.ph .n{font:10px/1 var(--mono);color:var(--n9);font-variant-numeric:tabular-nums}
.ph .act{all:unset;margin-left:auto;font:10px var(--mono);color:var(--n9);cursor:pointer}
.ph .act:hover{color:var(--accent)}
.sub{padding:0 var(--s4) var(--s4);font:11px/1.45 var(--sans);color:var(--n10)}

/* One row height, snapped to the scale: 24px. Dense but not cramped. */
.row{display:flex;align-items:center;gap:var(--s3);height:24px;padding:0 var(--s4);
  cursor:pointer;font:12px var(--mono);color:var(--n11);white-space:nowrap;
  overflow:hidden;transition:background var(--t-hover),color var(--t-hover)}
.row:hover{background:var(--n4);color:var(--n12)}
.row.sel{background:var(--n5);color:var(--n12);box-shadow:inset 2px 0 0 var(--accent)}
.row .name{overflow:hidden;text-overflow:ellipsis}
.row .caret{width:10px;flex:none;color:var(--n9);font-size:9px;text-align:center}
.row.dir{color:var(--n12)}
.row.dir .name{font-weight:550}
/* Indent guides: a hairline per nesting level, so depth is legible without counting pixels. */
.kids{position:relative}
.kids::before{content:"";position:absolute;top:0;bottom:0;left:var(--guide,12px);
  width:1px;background:var(--n6)}
.row .flag{margin-left:auto;font:700 10px var(--mono);flex:none}
.kids.shut{display:none}

/* Multi-line rows for sessions, skills, findings. */
.card{padding:var(--s3) var(--s4);border-bottom:1px solid var(--n6);cursor:default;
  transition:background var(--t-hover)}
.card.click{cursor:pointer}
.card.click:hover{background:var(--n4)}
.card .t{font:500 12px var(--sans);color:var(--n12);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.card .m{font:10.5px var(--mono);color:var(--n9);margin-top:var(--s1);
  font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .d{font:11.5px/1.45 var(--sans);color:var(--n11);margin-top:var(--s2);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.panel-cta{margin:var(--s4) var(--s4) var(--s5);padding:var(--s4);border-radius:var(--r2);
  background:var(--n4);border:1px solid var(--n6);cursor:pointer;
  transition:border-color var(--t-hover)}
.panel-cta:hover{border-color:var(--n8)}
.panel-cta b{display:block;font:500 12.5px var(--sans);color:var(--n12);margin-bottom:2px}
.panel-cta span{font:11.5px/1.45 var(--sans);color:var(--n10)}
.card.risk{box-shadow:inset 2px 0 0 var(--crit)}

.chip{display:inline-block;font:9.5px var(--mono);padding:1px 5px;border-radius:var(--r1);
  background:var(--n5);color:var(--n10);margin-left:var(--s2);vertical-align:1px}
.chip.project{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.critical{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.chip.high{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.medium,.chip.low,.chip.info{background:var(--n5);color:var(--n10)}

.empty{padding:var(--s6) var(--s5);color:var(--n9);font:12px/1.6 var(--sans);text-align:center}
.empty kbd{margin:0 2px}

.field{padding:var(--s4);border-bottom:1px solid var(--n6)}
.field label{display:block;font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;
  color:var(--n10);margin-bottom:var(--s3)}
input[type=text],input[type=password]{width:100%;background:var(--n2);border:1px solid var(--n7);
  color:var(--n12);border-radius:var(--r2);padding:6px var(--s3);font:12px var(--mono);
  outline:none;transition:border-color var(--t-hover)}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--n9)}
.field .line{display:flex;gap:var(--s2);margin-top:var(--s3);align-items:center}
.note{font:11px/1.45 var(--sans);margin-top:var(--s3)}
.cli-out{margin:var(--s3) 0 0;padding:var(--s3);background:var(--n2);border:1px solid var(--n6);
  border-radius:var(--r2);font:10.5px/1.5 var(--mono);color:var(--n11);white-space:pre-wrap;
  word-break:break-word;max-height:220px;overflow:auto}
.note.good{color:var(--ok)} .note.bad{color:var(--crit)} .note.dim{color:var(--n10)}

/* ── editor ─────────────────────────────────────────────────────────────── */
.ed{grid-row:1/2;background:var(--n1);display:flex;flex-direction:column;
  overflow:hidden;min-width:0;position:relative}
.tabs{display:flex;height:32px;flex:none;background:var(--n3);
  border-bottom:1px solid var(--n6);overflow-x:auto}
.tabs::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s3) 0 var(--s4);
  cursor:pointer;border-right:1px solid var(--n6);font:11.5px var(--mono);color:var(--n10);
  white-space:nowrap;flex:none;transition:background var(--t-hover),color var(--t-hover)}
.tab:hover{background:var(--n4);color:var(--n11)}
.tab.on{background:var(--n1);color:var(--n12);box-shadow:inset 0 -1px 0 var(--n1),
  inset 0 2px 0 var(--accent)}
.tab .x{opacity:0;font-size:13px;line-height:1;color:var(--n9)}
.tab:hover .x,.tab.on .x{opacity:.6}
.tab .x:hover{opacity:1;color:var(--crit)}
.tab .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}

.crumb{display:flex;align-items:center;gap:var(--s4);height:28px;flex:none;padding:0 var(--s4);
  background:var(--n2);border-bottom:1px solid var(--n6);
  font:11px var(--mono);color:var(--n9);font-variant-numeric:tabular-nums}
.crumb .path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .right{margin-left:auto;display:flex;align-items:center;gap:var(--s4);flex:none}
.seg{display:flex;background:var(--n4);border-radius:var(--r2);padding:1px}
.seg button{all:unset;padding:2px var(--s3);border-radius:var(--r1);cursor:pointer;
  font:11px var(--mono);color:var(--n10);transition:background var(--t-hover),color var(--t-hover)}
.seg button:hover{color:var(--n12)}
.seg button[aria-current=true]{background:var(--n6);color:var(--n12)}
.btn.save{padding:2px var(--s3);font-size:11px}
.btn.save kbd{background:rgba(255,255,255,.16);border:0;color:rgba(255,255,255,.85);
  margin-left:var(--s2)}
kbd{font:10px var(--mono);background:var(--n4);border:1px solid var(--n6);
  border-bottom-width:2px;padding:1px 4px;border-radius:var(--r1);color:var(--n10)}

.surface{flex:1;min-height:0;position:relative}
#mon,#mondiff{position:absolute;inset:0}
.surface .empty{position:absolute;inset:0;display:grid;place-content:center;align-content:center}

/* Monaco paints its own chrome; these pull it onto our ramp. */
.monaco-editor .scroll-decoration{box-shadow:none!important}
.monaco-editor .minimap{opacity:.55}

/* Session switcher */
.picker{all:unset;display:flex;align-items:center;gap:var(--s2);cursor:pointer;
  font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--n10);
  max-width:60%;transition:color var(--t-hover)}
.picker:hover{color:var(--n12)}
.picker #sess-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  text-transform:none;letter-spacing:0;font-weight:500;font-size:11.5px}
.picker .cv{font-size:8px;flex:none}
.sesslist{max-height:44%;overflow-y:auto;border-bottom:1px solid var(--n6);background:var(--n2)}
.sesslist .card{border-color:var(--n6)}
.sesslist .card.on{box-shadow:inset 2px 0 0 var(--accent);background:var(--n4)}

/* Rendered preview for files worth reading rather than editing. */
.prev{position:absolute;inset:0;overflow:auto;padding:var(--s6) 40px 80px;
  font:14px/1.65 var(--sans);color:var(--n12);max-width:none}
.prev>*{max-width:76ch}
.prev h1,.prev h2,.prev h3{font-weight:620;letter-spacing:-.01em;line-height:1.3;
  margin:var(--s6) 0 var(--s4)}
.prev h1{font-size:26px} .prev h2{font-size:19px} .prev h3{font-size:15px}
.prev h1:first-child,.prev h2:first-child{margin-top:0}
.prev p{margin:0 0 var(--s4)}
.prev ul,.prev ol{margin:0 0 var(--s4);padding-left:var(--s6)}
.prev li{margin-bottom:var(--s2)}
.prev code{font:12px var(--mono);background:var(--n4);padding:1px 5px;border-radius:var(--r1)}
.prev pre{background:var(--n2);border:1px solid var(--n6);border-radius:var(--r2);
  padding:var(--s4);overflow-x:auto;margin:0 0 var(--s4)}
.prev pre code{background:none;padding:0;font-size:12px;line-height:1.6}
.prev blockquote{margin:0 0 var(--s4);padding-left:var(--s4);
  border-left:2px solid var(--n7);color:var(--n11)}
.prev a{color:var(--accent)}
.prev hr{border:0;border-top:1px solid var(--n6);margin:var(--s6) 0}
.prev table{border-collapse:collapse;margin:0 0 var(--s4);font-size:13px}
.prev th,.prev td{border:1px solid var(--n6);padding:var(--s2) var(--s3);text-align:left}
.prev th{background:var(--n2);font-weight:600}
.prev img{max-width:100%;border-radius:var(--r2)}
.prev .imgwrap{display:grid;place-items:center;height:100%}
.prev .imgwrap img{max-height:80vh;box-shadow:0 8px 40px rgba(0,0,0,.3)}

/* ── agent ──────────────────────────────────────────────────────────────── */
.chat{grid-row:1/2;background:var(--n3);border-left:1px solid var(--n6);
  display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}
.app.no-chat .chat{border-left:0}
.chat .ph{padding-bottom:var(--s3)}

.picker{all:unset;display:flex;align-items:center;gap:var(--s2);cursor:pointer;
  color:var(--n11);max-width:62%;transition:color var(--t-hover)}
.picker:hover{color:var(--n12)}
.picker #sess-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:500 11.5px var(--sans)}
.picker .cv{font-size:8px;flex:none;color:var(--n9)}
.sesslist{max-height:46%;overflow-y:auto;border-bottom:1px solid var(--n6);background:var(--n2)}
.sesslist .card.on{box-shadow:inset 2px 0 0 var(--accent);background:var(--n4)}

.log{flex:1;overflow-y:auto;padding:var(--s4) var(--s4) var(--s6);scroll-behavior:auto}

/* A turn is one exchange: what you asked, and everything the agent did about it. Grouping by turn
   is what stops a long run reading as an undifferentiated log. */
.turn{margin-bottom:var(--s5)}
.turn+.turn{border-top:1px solid var(--n6);padding-top:var(--s5)}

.said{position:relative;background:var(--n4);border-radius:var(--r2);
  padding:var(--s3) var(--s4);font:13px/1.55 var(--sans);color:var(--n12);
  white-space:pre-wrap;word-break:break-word}
.said .mention{color:var(--accent)}

.work{margin-top:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.txt{font:13.5px/1.65 var(--sans);white-space:pre-wrap;word-break:break-word;color:var(--n12)}
.txt code{font:12px var(--mono);background:var(--n4);padding:1px 4px;border-radius:var(--r1)}
.txt strong{font-weight:620}
/* The caret marks live output. It is the only thing in the panel that moves. */
.txt.live::after{content:"";display:inline-block;width:7px;height:14px;margin-left:2px;
  background:var(--accent);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Activity: one line per tool call, dim, so twenty file reads do not shout. */
.acts{display:flex;flex-direction:column;gap:1px}
.act{display:flex;align-items:baseline;gap:var(--s3);padding:2px 0;
  font:11.5px var(--mono);color:var(--n10);cursor:default}
.act .dot{width:5px;height:5px;border-radius:50%;background:var(--n8);flex:none;
  transform:translateY(-1px)}
.act.run .dot{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.act .nm{color:var(--n11);flex:none}
.act .ar{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--n9)}
.act.more{cursor:pointer}
.act.more:hover{color:var(--n12)}
.act .cnt{color:var(--n9);flex:none}

/* Thinking is folded away. It is available, not in the way. */
.think{font:11.5px var(--mono);color:var(--n10)}
.think summary{cursor:pointer;list-style:none;color:var(--n9);padding:1px 0}
.think summary::-webkit-details-marker{display:none}
.think summary:hover{color:var(--n11)}
.think .body{font:12px/1.6 var(--sans);color:var(--n10);font-style:italic;
  border-left:2px solid var(--n6);padding-left:var(--s4);margin-top:var(--s2);
  white-space:pre-wrap;max-height:280px;overflow:auto}

/* Turn footer: what it cost, how long it took. Aider's readout is the clearest of any tool. */
.tfoot{display:flex;gap:var(--s4);margin-top:var(--s3);font:10.5px var(--mono);
  color:var(--n9);font-variant-numeric:tabular-nums;align-items:center}
.tfoot .act-btn{all:unset;cursor:pointer;color:var(--n9);transition:color var(--t-hover)}
.tfoot .act-btn:hover{color:var(--accent)}
.tfoot .sp{flex:1}

.err{font:12px/1.55 var(--sans);color:var(--crit);background:color-mix(in srgb,var(--crit) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--crit) 26%,transparent);border-radius:var(--r2);
  padding:var(--s3) var(--s4)}

/* Empty state offers the next move rather than describing the panel. */
.start{padding:var(--s6) var(--s4);color:var(--n10)}
.start h3{margin:0 0 var(--s2);font:600 13px var(--sans);color:var(--n12)}
.start p{margin:0 0 var(--s5);font:12.5px/1.55 var(--sans)}
.sugg{display:flex;flex-direction:column;gap:var(--s2)}
.sugg button{all:unset;cursor:pointer;padding:var(--s3) var(--s4);border-radius:var(--r2);
  background:var(--n4);border:1px solid transparent;font:12.5px/1.4 var(--sans);color:var(--n11);
  transition:background var(--t-hover),color var(--t-hover),border-color var(--t-hover)}
.sugg button:hover{background:var(--n5);color:var(--n12);border-color:var(--n7)}
.sugg button b{display:block;font-weight:560;color:var(--n12);margin-bottom:1px}
.sugg button span{font-size:11.5px;color:var(--n10)}

/* Jump-to-latest, shown only once you have scrolled away from the tail. */
.jump{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;z-index:4;
  background:var(--n5);border:1px solid var(--n7);color:var(--n11);border-radius:20px;
  padding:3px var(--s4);font:11px var(--mono);cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.35)}
.jump:hover{color:var(--n12)}

/* ── composer ───────────────────────────────────────────────────────────── */
.composer{flex:none;border-top:1px solid var(--n6);padding:var(--s3);position:relative}
.composer .box{background:var(--n2);border:1px solid var(--n7);border-radius:var(--r2);
  transition:border-color var(--t-hover)}
.composer .box:focus-within{border-color:var(--accent)}
.composer textarea{width:100%;background:transparent;border:0;color:var(--n12);
  padding:var(--s3);font:13px/1.5 var(--sans);resize:none;min-height:52px;max-height:40vh;
  outline:none;display:block}
.composer textarea::placeholder{color:var(--n9)}
.ctx{display:flex;flex-wrap:wrap;gap:var(--s2);padding:0 var(--s3) var(--s3)}
.ctx .tag{display:flex;align-items:center;gap:var(--s2);background:var(--n4);border-radius:var(--r1);
  padding:1px 5px;font:10.5px var(--mono);color:var(--n11)}
.ctx .tag button{all:unset;cursor:pointer;color:var(--n9);font-size:12px;line-height:1}
.ctx .tag button:hover{color:var(--crit)}
.crow2{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3)}
.crow2 .sp{flex:1}
.hintline{font:10.5px var(--mono);color:var(--n9);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}

/* @-mention picker, anchored above the composer. */
.ment{position:absolute;left:var(--s3);right:var(--s3);bottom:100%;margin-bottom:var(--s2);
  background:var(--n3);border:1px solid var(--n7);border-radius:var(--r2);z-index:8;
  box-shadow:0 12px 40px rgba(0,0,0,.45);max-height:230px;overflow-y:auto}
.ment .m{padding:5px var(--s4);font:11.5px var(--mono);color:var(--n11);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ment .m .dim{color:var(--n9)}
.ment .m.on{background:var(--n5);color:var(--n12);box-shadow:inset 2px 0 0 var(--accent)}

/* ── settings ──────────────────────────────────────────────────────────────
   Settings opens in the editor area, not the sidebar. Connection cards, install
   consoles and preference rows need room; a 274px column is why the old one
   felt like a form squeezed into a drawer. */
.sets{position:absolute;inset:0;display:grid;grid-template-columns:186px 1fr;overflow:hidden}
.sets nav{border-right:1px solid var(--n6);padding:var(--s5) 0;overflow-y:auto;background:var(--n2)}
.sets nav button{all:unset;display:block;width:100%;box-sizing:border-box;
  padding:6px var(--s5);cursor:pointer;font:12.5px var(--sans);color:var(--n10);
  transition:color var(--t-hover),background var(--t-hover)}
.sets nav button:hover{background:var(--n3);color:var(--n12)}
.sets nav button[aria-current=true]{color:var(--n12);background:var(--n3);
  box-shadow:inset 2px 0 0 var(--accent)}
.sets .pane{overflow-y:auto;padding:var(--s6) 40px 80px}
.sets .pane>section{max-width:660px}
.sets h1{font:600 20px/1.2 var(--sans);letter-spacing:-.015em;margin:0 0 var(--s2);color:var(--n12)}
.sets .lede{font:13px/1.55 var(--sans);color:var(--n10);margin:0 0 var(--s6)}
.sets h2{font:600 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--n10);
  margin:var(--s6) 0 var(--s4)}
.sets h2:first-of-type{margin-top:0}

/* One card per connectable thing. */
.card2{border:1px solid var(--n6);border-radius:var(--r3);background:var(--n2);
  padding:var(--s4) var(--s5);margin-bottom:var(--s4)}
.card2 .top{display:flex;align-items:flex-start;gap:var(--s4)}
.card2 .who2{flex:1;min-width:0}
.card2 .nm2{font:600 13.5px var(--sans);color:var(--n12);display:flex;align-items:center;
  gap:var(--s3)}
.card2 .sub2{font:12px/1.5 var(--sans);color:var(--n10);margin-top:2px}
.card2 .sub2 code{font:11.5px var(--mono);background:var(--n4);padding:1px 4px;border-radius:var(--r1)}
.card2 .acts2{display:flex;gap:var(--s2);flex:none;align-items:center}
.pip{width:7px;height:7px;border-radius:50%;flex:none}
.pip.on{background:var(--ok)} .pip.off{background:var(--n8)} .pip.warn{background:var(--warn)}
.ident{font:11.5px var(--mono);color:var(--n11);margin-top:var(--s3);
  background:var(--n3);border-radius:var(--r1);padding:var(--s2) var(--s3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.console{margin-top:var(--s3);padding:var(--s3);background:var(--n1);border:1px solid var(--n6);
  border-radius:var(--r2);font:10.5px/1.5 var(--mono);color:var(--n11);white-space:pre-wrap;
  word-break:break-word;max-height:240px;overflow:auto}
.picksel{background:var(--n3);border:1px solid var(--n7);color:var(--n12);border-radius:var(--r2);
  padding:4px var(--s3);font:11.5px var(--mono);outline:none}

/* Preference rows. */
.pref{display:flex;align-items:center;gap:var(--s4);padding:var(--s3) 0;
  border-bottom:1px solid var(--n6)}
.pref:last-child{border-bottom:0}
.pref .lbl{flex:1;min-width:0}
.pref .lbl b{display:block;font:500 13px var(--sans);color:var(--n12)}
.pref .lbl span{font:12px/1.45 var(--sans);color:var(--n10)}
.pref input[type=range]{width:150px;accent-color:var(--accent)}
.pref .val{font:11.5px var(--mono);color:var(--n11);width:42px;text-align:right;
  font-variant-numeric:tabular-nums}
.sw{all:unset;width:34px;height:19px;border-radius:10px;background:var(--n6);cursor:pointer;
  position:relative;flex:none;transition:background var(--t-state)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:var(--n11);transition:transform var(--t-state),background var(--t-state)}
.sw[aria-checked=true]{background:var(--accent)}
.sw[aria-checked=true]::after{transform:translateX(15px);background:#fff}

/* Plugin rows. */
.plug{display:flex;gap:var(--s4);padding:var(--s4) 0;border-bottom:1px solid var(--n6)}
.plug:last-child{border-bottom:0}
.plug .body2{flex:1;min-width:0}
.plug .nm3{font:600 13px var(--sans);color:var(--n12)}
.plug .ds3{font:12px/1.5 var(--sans);color:var(--n10);margin-top:2px}
.plug .why{font:12px/1.5 var(--sans);color:var(--n11);margin-top:var(--s3);
  border-left:2px solid var(--accent);padding-left:var(--s3)}
.plug .done{font:11.5px var(--mono);color:var(--ok);flex:none;align-self:flex-start;
  padding-top:var(--s1)}
/* Buttons in a row must not stretch to its height. */
.plug>.btn{flex:none;align-self:flex-start}
.searchbox{width:100%;background:var(--n2);border:1px solid var(--n7);color:var(--n12);
  border-radius:var(--r2);padding:7px var(--s4);font:12.5px var(--sans);outline:none;
  margin-bottom:var(--s4)}
.searchbox:focus{border-color:var(--accent)}

/* ── status rail — the instrument readout ───────────────────────────────── */
.status{grid-column:2/5;grid-row:2/3;display:flex;align-items:center;gap:var(--s5);
  padding:0 var(--s4);background:var(--n3);border-top:1px solid var(--n6);
  font:11px var(--mono);color:var(--n10);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden}
.status .cell{display:flex;align-items:center;gap:var(--s2);flex:none}
.status .cell b{font-weight:600;color:var(--n11)}
.status .sp{flex:1}
.status .live{color:var(--accent)}
.status .score.ok{color:var(--ok)} .status .score.warn{color:var(--warn)}
.status .score.crit{color:var(--crit)}
.status button{all:unset;cursor:pointer;transition:color var(--t-hover)}
.status button:hover{color:var(--n12)}

/* ── palette — the one place that earns a transition ────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:49}
.pal{position:fixed;top:14vh;left:50%;transform:translateX(-50%);width:min(640px,90vw);
  background:var(--n3);border:1px solid var(--n7);border-radius:var(--r3);z-index:50;
  box-shadow:0 20px 60px rgba(0,0,0,.5);overflow:hidden;
  animation:rise var(--t-enter)}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(-6px)}}
.pal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--n6);
  border-radius:0;padding:var(--s4) var(--s5);font:14px var(--sans);color:var(--n12)}
.pal input:focus{border-color:var(--n6)}
.pal .hits{max-height:46vh;overflow-y:auto}
.pal .hit{display:flex;align-items:center;gap:var(--s3);padding:6px var(--s5);
  font:12px var(--mono);color:var(--n11);cursor:pointer}
.pal .hit .dim{color:var(--n9)}
.pal .hit .sp{flex:1}
.pal .hit.on{background:var(--n5);color:var(--n12);box-shadow:inset 2px 0 0 var(--accent)}
.pal .hit em{font-style:normal;color:var(--accent)}
.pal .foot{display:flex;gap:var(--s4);padding:var(--s3) var(--s5);border-top:1px solid var(--n6);
  font:10px var(--mono);color:var(--n9)}
.hidden{display:none!important}
</style>
</head>

<script src="/vendor/vs/loader.js"></script>
<script>
  // Monaco resolves its worker from this hook. Without it the editor silently falls back to
  // running language work on the main thread, which is where the jank comes from.
  require.config({ paths: { vs: '/vendor/vs' } });
  window.MonacoEnvironment = { getWorkerUrl: () => {
    const proxy = URL.createObjectURL(new Blob([`
      self.MonacoEnvironment = { baseUrl: '${location.origin}/vendor/' };
      importScripts('${location.origin}/vendor/vs/base/worker/workerMain.js');
    `], { type: 'text/javascript' }));
    return proxy;
  }};
</script>
<script>
'use strict';
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
const frag = h => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const MAC = navigator.platform.toUpperCase().includes('MAC');

// Surface our own failures rather than dying silently in the console. An IDE that goes blank with
// no explanation is worse than one that admits what broke.
addEventListener('error', e => {
  const c = el('crumb');
  if (c) c.textContent = 'error: ' + (e.message || e.error) + '  @' + (e.filename||'').split('/').pop() + ':' + e.lineno;
});
addEventListener('unhandledrejection', e => {
  const c = el('crumb');
  if (c) c.textContent = 'error: ' + (e.reason?.message ?? e.reason);
});

let state=null, git=null, conn=null, treeData=null, files=[], view='src', panel='files';
const tabs=[]; let active=null;

/* ════ editor — Monaco ═══════════════════════════════════════════════════
   One editor instance, one model per open file. Models are the reason: they hold
   undo history, cursor position, folds and selection per file, so switching tabs
   restores exactly where you were rather than resetting to the top. */
let mon=null, monDiff=null, ready=false;
const models=new Map();   // path -> monaco.ITextModel
const viewState=new Map();// path -> editor view state (cursor, scroll, folds)

const LANG={rs:'rust',ts:'typescript',tsx:'typescript',js:'javascript',jsx:'javascript',
  mjs:'javascript',py:'python',go:'go',rb:'ruby',php:'php',java:'java',json:'json',
  jsonc:'json',yml:'yaml',yaml:'yaml',toml:'ini',ini:'ini',md:'markdown',sh:'shell',
  bash:'shell',zsh:'shell',sql:'sql',css:'css',scss:'scss',html:'html',xml:'xml',
  svg:'xml',tf:'hcl',hcl:'hcl',proto:'protobuf',graphql:'graphql',lock:'ini'};
const langOf=p=>{
  const base=p.split('/').pop().toLowerCase();
  if(base==='dockerfile'||base.startsWith('dockerfile.')) return 'dockerfile';
  if(base==='makefile') return 'shell';
  return LANG[base.split('.').pop()]??'plaintext';
};

/** Read a CSS custom property so the editor theme stays derived from one palette. */
const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function defineTheme(){
  const dark=matchMedia('(prefers-color-scheme: dark)').matches
    && !document.documentElement.dataset.theme;
  monaco.editor.defineTheme('keel',{
    base: dark||document.documentElement.dataset.theme==='dark' ? 'vs-dark':'vs',
    inherit:true,
    rules:[
      {token:'',                foreground:tok('--n12').slice(1)},
      {token:'comment',         foreground:tok('--syn-com').slice(1),fontStyle:'italic'},
      {token:'string',          foreground:tok('--syn-str').slice(1)},
      {token:'keyword',         foreground:tok('--syn-key').slice(1)},
      {token:'number',          foreground:tok('--syn-num').slice(1)},
      {token:'type',            foreground:tok('--syn-type').slice(1)},
      {token:'type.identifier', foreground:tok('--syn-type').slice(1)},
      {token:'identifier',      foreground:tok('--n12').slice(1)},
      {token:'function',        foreground:tok('--syn-fn').slice(1)},
      {token:'variable',        foreground:tok('--syn-var').slice(1)},
      {token:'operator',        foreground:tok('--n11').slice(1)},
      {token:'delimiter',       foreground:tok('--n11').slice(1)},
    ],
    colors:{
      'editor.background':tok('--n1'),
      'editor.foreground':tok('--n12'),
      'editorLineNumber.foreground':tok('--n9'),
      'editorLineNumber.activeForeground':tok('--n11'),
      'editorCursor.foreground':tok('--accent'),
      'editor.selectionBackground':tok('--accent')+'44',
      'editor.inactiveSelectionBackground':tok('--n5'),
      'editor.lineHighlightBackground':tok('--n2'),
      'editorIndentGuide.background1':tok('--n4'),
      'editorIndentGuide.activeBackground1':tok('--n7'),
      'editorWhitespace.foreground':tok('--n6'),
      'editorGutter.background':tok('--n1'),
      'editorWidget.background':tok('--n3'),
      'editorWidget.border':tok('--n7'),
      'editorSuggestWidget.background':tok('--n3'),
      'editorSuggestWidget.border':tok('--n7'),
      'input.background':tok('--n2'),
      'input.border':tok('--n7'),
      'scrollbarSlider.background':tok('--n7')+'99',
      'scrollbarSlider.hoverBackground':tok('--n8'),
      'scrollbarSlider.activeBackground':tok('--n8'),
      'minimap.background':tok('--n1'),
      'diffEditor.insertedTextBackground':tok('--add')+'22',
      'diffEditor.removedTextBackground':tok('--del')+'22',
      'editorOverviewRuler.border':tok('--n6'),
      'editorBracketMatch.background':tok('--n5'),
      'editorBracketMatch.border':tok('--n8'),
    },
  });
  monaco.editor.setTheme('keel');
}

const EDITOR_OPTS={
  theme:'keel',
  fontFamily:'ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace',
  fontSize:12.5,
  lineHeight:1.6,
  fontLigatures:false,
  minimap:{enabled:true,renderCharacters:false,maxColumn:90},
  scrollBeyondLastLine:false,
  renderLineHighlight:'line',
  smoothScrolling:false,          // instant beats smooth in an editor
  cursorBlinking:'solid',
  cursorSmoothCaretAnimation:'off',
  padding:{top:12,bottom:60},
  bracketPairColorization:{enabled:false}, // one palette; rainbow brackets fight it
  guides:{indentation:true,bracketPairs:false},
  renderWhitespace:'selection',
  scrollbar:{verticalScrollbarSize:10,horizontalScrollbarSize:10,useShadows:false},
  overviewRulerBorder:false,
  automaticLayout:true,
  tabSize:2,
  wordWrap:'off',
  stickyScroll:{enabled:true},
};

function initMonaco(){
  return new Promise(res=>{
    require(['vs/editor/editor.main'],()=>{
      defineTheme();
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change',defineTheme);
      mon=monaco.editor.create(el('surface'),{...EDITOR_OPTS,value:'',language:'plaintext'});

      // Keel owns save, so Monaco must not also try to handle it.
      mon.addCommand(monaco.KeyMod.CtrlCmd|monaco.KeyCode.KeyS,()=>save());
      mon.onDidChangeModelContent(()=>{
        const tab=tabs.find(t=>t.path===active);
        if(tab&&!tab.dirty){ tab.dirty=true; drawTabs(); drawStatus(); }
      });
      mon.onDidChangeCursorPosition(drawStatus);
      ready=true; res();
    });
  });
}

function modelFor(path,content){
  let m=models.get(path);
  if(!m){
    m=monaco.editor.createModel(content,langOf(path),monaco.Uri.file('/'+path));
    models.set(path,m);
  }
  return m;
}

/* ════ tabs ══════════════════════════════════════════════════════════════ */
function drawTabs(){
  el('tabs').innerHTML='';
  tabs.forEach(t=>{
    const n=frag('<div class="tab'+(t.path===active?' on':'')+'"><span>'+esc(t.path.split('/').pop())+
      '</span>'+(t.dirty?'<span class="dot" title="unsaved"></span>':'<span class="x">×</span>')+'</div>');
    n.onclick=e=>{ if(e.target.classList.contains('x')) closeTab(t.path); else { active=t.path; draw(); } };
    el('tabs').append(n);
  });
}
function closeTab(p){
  const i=tabs.findIndex(t=>t.path===p); if(i<0) return;
  tabs.splice(i,1);
  models.get(p)?.dispose(); models.delete(p); viewState.delete(p);
  if(active===p) active=tabs.at(-1)?.path??null;
  draw();
}
async function open(path,mode){
  if(!tabs.some(t=>t.path===path)){
    const r=await fetch('/api/file?path='+encodeURIComponent(path));
    if(!r.ok){ toast(await r.text()); return; }
    const f=await r.json();
    tabs.push({path,content:f.content,dirty:false,truncated:f.truncated});
    if(ready) modelFor(path,f.content);
  }
  // Leaving a file preserves where you were in it.
  if(active&&active!==path&&mon&&view==='src') viewState.set(active,mon.saveViewState());
  active=path;
  view = mode ?? (previewable(path) ? 'prev' : 'src');
  syncView();
  draw();
}
function syncView(){
  el('v-src').setAttribute('aria-current',view==='src');
  el('v-prev').setAttribute('aria-current',view==='prev');
  el('v-diff').setAttribute('aria-current',view==='diff');
}
el('v-prev').onclick=()=>{ if(active&&mon&&view==='src') viewState.set(active,mon.saveViewState());
  view='prev'; syncView(); draw(); };
el('v-src').onclick=()=>{ if(active&&mon&&view==='src') viewState.set(active,mon.saveViewState());
  view='src'; syncView(); draw(); };
el('v-diff').onclick=()=>{ if(active&&mon&&view==='src') viewState.set(active,mon.saveViewState());
  view='diff'; syncView(); draw(); };

function showEmpty(html){
  el('surface').innerHTML='<div class="empty">'+html+'</div>';
  mon=null; monDiff=null; ready=false;
}
function toast(t){ el('crumb').textContent=t; }

/* ════ preview ═══════════════════════════════════════════════════════════
   Some files are for reading, not editing. Markdown gets rendered; images get
   shown. Everything else has no preview and the toggle stays hidden. */
const IMG=/\.(png|jpe?g|gif|webp|avif|ico)$/i;
const previewable=p=>/\.mde?$|\.markdown$/i.test(p)||IMG.test(p);

/** A deliberately small Markdown subset: headings, lists, code, quotes, tables, inline marks.
    Everything is escaped first — this is repository content nobody has reviewed. */
function markdown(src){
  const blocks=[];
  // Fenced code is extracted before anything else so its contents are never parsed as markup.
  src=src.replace(/```(\w*)\n([\s\S]*?)```/g,(m,lang,code)=>
    '\u0000'+(blocks.push('<pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre>')-1)+'\u0000');

  const inline=t=>esc(t)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,(m,a,u)=>'<img alt="'+a+'" src="'+imgSrc(u)+'">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');

  const out=[]; let list=null, table=null;
  const shutList=()=>{ if(list){ out.push('</'+list+'>'); list=null; } };
  const shutTable=()=>{ if(table){ out.push('</tbody></table>'); table=null; } };

  for(const raw of src.split('\n')){
    const line=raw.trimEnd();
    if(/^\u0000\d+\u0000$/.test(line.trim())){ shutList(); shutTable(); out.push(line.trim()); continue; }
    if(!line.trim()){ shutList(); shutTable(); continue; }

    const h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ shutList(); shutTable(); out.push('<h'+Math.min(h[1].length,3)+'>'+inline(h[2])+
      '</h'+Math.min(h[1].length,3)+'>'); continue; }
    if(/^(-{3,}|\*{3,})$/.test(line.trim())){ shutList(); shutTable(); out.push('<hr>'); continue; }

    // A table needs its separator row to be recognised, so peek by shape rather than lookahead.
    if(/^\|.*\|$/.test(line.trim())){
      const cells=line.trim().slice(1,-1).split('|').map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c))) continue;   // separator
      if(!table){ shutList(); out.push('<table><thead><tr>'+cells.map(c=>'<th>'+inline(c)+'</th>').join('')+
        '</tr></thead><tbody>'); table=1; continue; }
      out.push('<tr>'+cells.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'); continue;
    }
    shutTable();

    const q=line.match(/^>\s?(.*)$/);
    if(q){ shutList(); out.push('<blockquote>'+inline(q[1])+'</blockquote>'); continue; }

    const ul=line.match(/^\s*[-*+]\s+(.*)$/), ol=line.match(/^\s*\d+[.)]\s+(.*)$/);
    if(ul||ol){
      const want=ul?'ul':'ol';
      if(list!==want){ shutList(); out.push('<'+want+'>'); list=want; }
      out.push('<li>'+inline((ul??ol)[1])+'</li>'); continue;
    }
    shutList();
    out.push('<p>'+inline(line)+'</p>');
  }
  shutList(); shutTable();
  return out.join('\n').replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[+i]);
}

/** Resolve a relative image reference against the open file, through the raw endpoint. */
function imgSrc(u){
  if(/^(https?:)?\/\//.test(u)||u.startsWith('data:')) return esc(u);
  const dir=(active??'').split('/').slice(0,-1).join('/');
  const rel=u.replace(/^\.\//,'');
  return '/api/raw?path='+encodeURIComponent(dir?dir+'/'+rel:rel);
}

function drawPreview(tab){
  if(mon){ mon.dispose(); mon=null; ready=false; }
  if(monDiff){ monDiff.dispose(); monDiff=null; }
  el('crumb').textContent=tab.path+'  ·  preview';
  el('surface').innerHTML='<div class="prev" id="prev"></div>';
  if(IMG.test(tab.path)){
    el('prev').innerHTML='<div class="imgwrap"><img alt="'+esc(tab.path)+'" src="/api/raw?path='+
      encodeURIComponent(tab.path)+'"></div>';
  } else {
    el('prev').innerHTML=markdown(tab.content);
  }
  drawStatus();
}

/* ════ rendering ═════════════════════════════════════════════════════════ */
async function draw(){
  drawTabs();
  document.querySelectorAll('.row[data-p]').forEach(r=>r.classList.toggle('sel',r.dataset.p===active));
  const tab=tabs.find(t=>t.path===active);

  if(!tab){
    el('crumb').textContent='No file open';
    if(mon){ mon.dispose(); mon=null; ready=false; }
    if(monDiff){ monDiff.dispose(); monDiff=null; }
    el('surface').innerHTML='<div class="empty">Nothing open.<br><br>'+
      '<kbd>'+(MAC?'⌘P':'Ctrl+P')+'</kbd> find a file · <kbd>'+(MAC?'⌘⇧P':'Ctrl+Shift+P')+'</kbd> commands</div>';
    drawStatus(); return;
  }

  el('v-prev').classList.toggle('hidden',!!tab.settings||!previewable(tab.path));
  // Source/Diff is meaningless on a settings tab.
  el('v-src').classList.toggle('hidden',!!tab.settings);
  el('v-diff').classList.toggle('hidden',!!tab.settings);
  if(view==='prev'&&!previewable(tab.path)) view='src';
  if(view==='prev'){ syncView(); drawPreview(tab); return; }
  if(tab.settings){
    if(mon){ mon.dispose(); mon=null; ready=false; }
    if(monDiff){ monDiff.dispose(); monDiff=null; }
    drawSettings(); return;
  }
  if(view==='diff'){ await drawDiff(tab); return; }

  if(monDiff){ monDiff.dispose(); monDiff=null; el('surface').innerHTML=''; }
  if(!mon||!ready){ el('surface').innerHTML=''; await initMonaco(); }

  el('crumb').textContent=tab.path+(tab.truncated?'  ·  truncated':'');
  mon.setModel(modelFor(tab.path,tab.content));
  const vs=viewState.get(tab.path);
  if(vs) mon.restoreViewState(vs);
  mon.focus();
  drawStatus();
}

async function drawDiff(tab){
  if(mon){ mon.dispose(); mon=null; ready=false; }
  el('surface').innerHTML='';
  const orig=await (await fetch('/api/file/original?path='+encodeURIComponent(tab.path))).json();
  await new Promise(res=>require(['vs/editor/editor.main'],res));
  defineTheme();
  if(monDiff){ monDiff.dispose(); monDiff=null; }
  monDiff=monaco.editor.createDiffEditor(el('surface'),{
    ...EDITOR_OPTS, readOnly:true, renderSideBySide:false, ignoreTrimWhitespace:false,
    renderOverviewRuler:false, minimap:{enabled:false},
  });
  const lang=langOf(tab.path);
  monDiff.setModel({
    original: monaco.editor.createModel(orig.content,lang),
    modified: modelFor(tab.path,tab.content),
  });
  el('crumb').textContent=tab.path+(orig.content?'  ·  vs HEAD':'  ·  new file');
  drawStatus();
}

async function save(){
  const tab=tabs.find(t=>t.path===active);
  if(!tab||!tab.dirty) return;
  const content=models.get(tab.path)?.getValue()??tab.content;
  const r=await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({path:tab.path,content})});
  if(r.ok){ tab.content=content; tab.dirty=false; drawTabs(); refresh(); }
}

/* ════ side panels ═══════════════════════════════════════════════════════ */
const INDENT=13;
function node(n,depth){
  // Files sit where a folder's chevron would be, so names in the same folder line up whether or
  // not their siblings are expandable.
  const pad=8+depth*INDENT;
  if(!n.dir){
    const e=frag('<div class="row" style="padding-left:'+(pad+14)+'px" data-p="'+esc(n.path)+
      '"><span class="name">'+esc(n.name)+'</span></div>');
    e.onclick=()=>open(n.path); return e;
  }
  const wrap=document.createElement('div');
  const shut=depth>0;
  const head=frag('<div class="row dir" style="padding-left:'+pad+'px"><span class="caret">'+
    (shut?'▸':'▾')+'</span><span class="name">'+esc(n.name)+'</span></div>');
  const kids=document.createElement('div');
  kids.className='kids'+(shut?' shut':'');
  kids.style.setProperty('--guide',(pad+5)+'px');
  (n.children??[]).forEach(c=>kids.append(node(c,depth+1)));
  head.onclick=()=>{ kids.classList.toggle('shut');
    head.querySelector('.caret').textContent=kids.classList.contains('shut')?'▸':'▾'; };
  wrap.append(head,kids); return wrap;
}
const flatten=(ns,out=[])=>{ for(const n of ns) n.dir?flatten(n.children??[],out):out.push(n.path); return out; };

const H=(title,count,act)=>'<div class="ph"><h2>'+title+'</h2>'+
  (count!=null?'<span class="n">'+count+'</span>':'')+(act??'')+'</div>';

const PANELS={
  files(){
    el('side').innerHTML=H('Explorer')+'<div id="tree"></div>';
    (treeData??[]).forEach(n=>el('tree').append(node(n,0)));
  },
  changes(){
    if(!git?.is_repo){ el('side').innerHTML=H('Changes')+'<div class="empty">Not a git repository.</div>'; return; }
    el('side').innerHTML=H('Changes',git.changes.length,'<span class="act">'+esc(git.branch??'')+'</span>')+'<div id="ch"></div>';
    if(!git.changes.length){ el('ch').innerHTML='<div class="empty">Working tree clean.</div>'; return; }
    git.changes.forEach(c=>{
      const e=frag('<div class="row" data-p="'+esc(c.path)+'" title="'+esc(c.path)+'">'+
        '<span class="name">'+esc(c.path.split('/').pop())+'</span>'+
        '<span class="flag" style="color:var(--'+(c.label==='untracked'||c.label==='added'?'add':c.label==='deleted'?'del':'warn')+')">'+
        esc(c.status.trim()||'?')+'</span></div>');
      // Opening from Changes goes straight to the diff — that is the question being asked.
      e.onclick=()=>open(c.path,'diff');
      el('ch').append(e);
    });
  },
  skills(){
    const w=state?.workspace; if(!w) return;
    const grp=(t,items,fn)=>H(t,items.length)+(items.length?items.map(fn).join(''):'<div class="empty">None.</div>');
    const named=x=>'<div class="card"><div class="t">'+esc(x.name)+'<span class="chip '+x.scope+'">'+esc(x.scope)+'</span></div>'+
      (x.description?'<div class="d">'+esc(x.description)+'</div>':'')+'</div>';
    el('side').innerHTML=
      grp('Skills',w.skills,named)+
      grp('Plugins',w.plugins,p=>'<div class="card"><div class="t">'+esc(p.name)+'<span class="chip">'+esc(p.scope??'')+
        '</span></div><div class="m">'+esc(p.marketplace??'')+'</div></div>')+
      grp('Subagents',w.agents,named)+grp('Commands',w.commands,named)+
      grp('Hooks',w.hooks,h=>'<div class="card'+(h.scope==='project'?' risk':'')+'"><div class="t">'+esc(h.event)+
        '<span class="chip '+h.scope+'">'+esc(h.scope)+'</span></div><div class="m">'+esc(h.command)+'</div></div>')+
      '<div class="panel-cta" id="cta-plugins"><b>Add a skill or plugin</b>'+
      '<span>Recommendations for this repository, and the full marketplace.</span></div>'+
      grp('MCP servers',w.mcp_servers,m=>'<div class="card'+(m.scope==='project'?' risk':'')+'"><div class="t">'+esc(m.name)+
        '<span class="chip '+m.scope+'">'+esc(m.scope)+'</span></div><div class="m">'+esc(m.endpoint??'')+'</div></div>');
  },
  _skillsCta(){ el('cta-plugins')&&(el('cta-plugins').onclick=()=>{ setsTab='plugins'; openSettings(); }); },
  readiness(){
    const s=state?.scan; if(!s) return;
    el('side').innerHTML=H('Readiness',s.score+'/100','<button class="act" id="a-rescan">rescan</button>')+
      (s.findings.length?s.findings.map((f,i)=>'<div class="card'+(f.path?' click':'')+
        (f.severity==='critical'?' risk':'')+'" data-f="'+i+'"><div class="t">'+esc(f.title)+
        '<span class="chip '+f.severity+'">'+esc(f.severity)+'</span></div>'+
        (f.path?'<div class="m">'+esc(f.path)+'</div>':'')+
        '<div class="d">'+esc(f.fix.description)+'</div></div>').join('')
        :'<div class="empty">Nothing to report.<br>This repository is ready.</div>');
    el('a-rescan').onclick=refresh;
    el('side').querySelectorAll('[data-f]').forEach(r=>{
      const f=s.findings[+r.dataset.f]; if(f.path) r.onclick=()=>open(f.path);
    });
  },
  connections(){ drawConnections(); },
};

/// Clicking the active icon collapses the panel, the way every editor behaves. That must only
/// happen on a real click — a deep link or a refresh calling setPanel would otherwise collapse the
/// sidebar the moment you asked for it.
function setPanel(p,fromClick){
  if(fromClick && panel===p && !el('app').classList.contains('no-side')){ toggleSide(); return; }
  panel=p;
  el('app').classList.remove('no-side');
  document.querySelectorAll('.ic').forEach(b=>b.setAttribute('aria-current',b.dataset.p===p));
  PANELS[p]();
  el('side').append(frag('<div class="rz left" id="rz1"></div>'));
  wireResize(el('rz1'),'--side','keel.side',190,540,false);
}
document.querySelectorAll('.ic[data-p]').forEach(b=>b.onclick=()=>setPanel(b.dataset.p,true));
el('ic-settings').onclick=openSettings;

/* ════ CLI setup ═════════════════════════════════════════════════════════
   Keel drives the first-party CLIs rather than asking for long-lived tokens.
   Install and login both stream their output, because these commands print
   things you have to act on — gh shows a one-time code for the browser. */
let clis=null;

async function loadClis(){ clis=await (await fetch('/api/cli')).json(); }

/** Run an install or login, streaming its output into a live console block. */
function runCli(kind,id,host,profile){
  host.innerHTML='<pre class="console" id="cli-out"></pre>';
  const out=el('cli-out');
  const es=new EventSource('/api/cli/'+kind+'?id='+encodeURIComponent(id)+
    (profile?'&profile='+encodeURIComponent(profile):''));
  const write=t=>{ out.textContent+=t+'\n'; out.scrollTop=1e9; };
  es.addEventListener('line',e=>write(e.data));
  es.addEventListener('fatal',e=>{ write(e.data); es.close(); });
  es.addEventListener('done',async e=>{
    es.close();
    write(e.data==='0' ? '\n✓ done' : '\nexited '+e.data);
    await loadClis(); await loadConn();
    if(active===SETTINGS) drawSettings();
  });
}

/* ════ connections ═══════════════════════════════════════════════════════ */
let repoList=null;
function cliBlock(t,extra){
  const state = !t.installed ? 'missing' : t.authenticated ? 'ready' : 'unauth';
  const note =
    state==='ready'  ? '<div class="note good">'+esc(t.version??'')+'</div>' :
    state==='unauth' ? '<div class="note dim">Installed but not signed in.</div>' :
    t.install_cmd    ? '<div class="note dim">Not installed. Keel will run <code>'+esc(t.install_cmd)+'</code>.</div>'
                     : '<div class="note bad">Not installed, and no supported package manager found. '+
                       '<a href="'+esc(t.manual)+'" target="_blank" rel="noopener">Install instructions</a></div>';
  const actions = [];
  if(state==='missing'&&t.install_cmd) actions.push('<button class="btn" data-cli="install" data-id="'+t.id+'">Install</button>');
  if(state==='unauth') actions.push('<button class="btn" data-cli="login" data-id="'+t.id+'">Sign in</button>');
  if(state==='ready') actions.push('<button class="btn quiet" data-cli="login" data-id="'+t.id+'">Re-authenticate</button>');
  return '<div class="field"><label>'+esc(t.label)+'</label>'+note+
    '<div class="line">'+actions.join('')+(extra??'')+'</div>'+
    '<div id="cli-'+t.id+'"></div></div>';
}

function drawConnections(){
  const gh=conn?.github, cf=conn?.cloudflare;
  const byId=id=>(clis??[]).find(c=>c.id===id);
  let h=H('Connections');

  h+='<div class="field"><label>Claude Code</label>'+(conn?.claude
    ? '<div class="note good">Installed. Keel drives your own <code>claude</code>, so your subscription covers it.</div>'
    : '<div class="note bad">Not on PATH. The agent panel needs Claude Code installed.</div>')+'</div>';

  const g=byId('gh');
  if(g) h+=cliBlock(g, gh?'<button class="btn quiet" id="gh-repos">Browse repos</button>':'');
  if(gh) h+='<div class="field"><label>GitHub account</label><div class="note good">'+esc(gh.login)+
    (conn.github_via_gh?' — via the gh CLI':' — via a stored token')+'</div>'+
    (conn.github_via_gh?'':'<div class="line"><button class="btn quiet" id="gh-out">Forget token</button></div>')+
    '</div>';

  const w=byId('wrangler');
  if(w) h+=cliBlock(w);
  h+='<div class="field"><label>Cloudflare account</label>'+(cf
    ? '<div class="note good">'+cf.map(a=>esc(a.name)).join(', ')+'</div>'+
      '<div class="line"><button class="btn quiet" id="cf-out">Forget token</button></div>'
    : '<input type="password" id="cf-tok" placeholder="API token (optional)">'+
      '<div class="line"><button class="btn quiet" id="cf-in">Use a token</button></div>'+
      '<div class="note dim">Signing in with Wrangler above is enough for deploys. A scoped token is '+
      'only needed for the account and resource views, and stays in your keychain.</div>')+
    '<div id="cf-msg"></div></div>';

  const a=byId('aws');
  if(a) h+=cliBlock(a);

  h+='<div class="field"><label>Open a repository</label>'+
    '<input type="text" id="op" placeholder="~/Dev/my-project" spellcheck="false">'+
    '<div class="line"><button class="btn" id="op-go">Open</button></div><div id="op-msg"></div></div>'+
    '<div id="repos"></div>';
  el('side').innerHTML=h;

  el('side').querySelectorAll('[data-cli]').forEach(b=>b.onclick=()=>
    runCli(b.dataset.cli,b.dataset.id,el('cli-'+b.dataset.id)));

  const say=(id,t,ok)=>el(id).innerHTML='<div class="note '+(ok?'good':'bad')+'">'+esc(t)+'</div>';
  const post=(url,body)=>fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});

  el('gh-in')&&(el('gh-in').onclick=async()=>{
    const r=await post('/api/connect/github',{token:el('gh-tok').value});
    r.ok?(await loadConn(),setPanel('connections')):say('gh-msg',await r.text(),false); });
  el('cf-in')&&(el('cf-in').onclick=async()=>{
    const r=await post('/api/connect/cloudflare',{token:el('cf-tok').value});
    r.ok?(await loadConn(),setPanel('connections')):say('cf-msg',await r.text(),false); });
  const drop=p=>async()=>{ await post('/api/disconnect',{provider:p}); await loadConn(); setPanel('connections'); };
  el('gh-out')&&(el('gh-out').onclick=drop('github'));
  el('cf-out')&&(el('cf-out').onclick=drop('cloudflare'));

  el('gh-repos')&&(el('gh-repos').onclick=async()=>{
    el('repos').innerHTML='<div class="empty">Loading…</div>';
    const r=await fetch('/api/github/repos');
    if(!r.ok){ el('repos').innerHTML='<div class="empty">'+esc(await r.text())+'</div>'; return; }
    repoList=await r.json();
    el('repos').innerHTML=H('Repositories',repoList.length)+repoList.map((x,i)=>
      '<div class="card click" data-r="'+i+'"><div class="t">'+esc(x.name)+
      (x.private?'<span class="chip">private</span>':'')+'</div><div class="m">'+esc(x.full_name)+'</div>'+
      (x.description?'<div class="d">'+esc(x.description)+'</div>':'')+'</div>').join('');
    el('repos').querySelectorAll('[data-r]').forEach(row=>row.onclick=async()=>{
      const x=repoList[+row.dataset.r];
      row.querySelector('.m').textContent='cloning…';
      const res=await post('/api/github/clone',{clone_url:x.clone_url,name:x.name});
      row.querySelector('.m').textContent=res.ok?'opened':await res.text();
      if(res.ok){ tabs.length=0; active=null; await refresh(); setPanel('files'); }
    });
  });
  el('op-go').onclick=async()=>{
    const r=await post('/api/open',{path:el('op').value});
    if(!r.ok){ say('op-msg',await r.text(),false); return; }
    tabs.length=0; active=null; await refresh(); setPanel('files');
  };
}

/* ════ agent ═════════════════════════════════════════════════════════════ */
let stream=null, sessionId=null, permMode='acceptEdits';
let turn=null;          // the DOM of the exchange in flight
let started=0;          // wall clock for the turn footer
let cost=null;
const MODE_LABEL={plan:'Plan',acceptEdits:'Auto'};

function setMode(m){
  permMode=m;
  el('pm-plan').setAttribute('aria-current',m==='plan');
  el('pm-auto').setAttribute('aria-current',m==='acceptEdits');
  el('prompt').placeholder = m==='plan'
    ? 'Ask for a plan…   @ for a file'
    : 'Describe a change…   @ for a file';
  drawStatus();
}

el('log').addEventListener('scroll',()=>{

/* ── turn construction ─────────────────────────────────────────────────── */
function newTurn(promptText){
  const t=frag('<div class="turn"><div class="said"></div><div class="work"></div>'+
    '<div class="tfoot hidden"></div></div>');
  t.querySelector('.said').innerHTML=mentionise(promptText);
  el('log').append(t);
  return {
    root:t, work:t.querySelector('.work'), foot:t.querySelector('.tfoot'),
    text:null, think:null, acts:null, lastTool:null, lastCount:0,
  };
}

/** Absolute paths inside the open repo are noise — the panel already tells you which repo. */
function trimRepo(t){
  const root=state?.repo;
  return root ? t.split(root+'/').join('').split(root).join('.') : t;
}

/** Highlight @paths in what you typed, so the context you attached is visible afterwards. */
function mentionise(t){
  return esc(t).replace(/(^|\s)(@[\w./\-]+)/g,'$1<span class="mention">$2</span>');
}

function textNode(){
  if(!turn.text){
    turn.text=frag('<div class="txt live"></div>');
    turn.text.dataset.raw='';
    turn.work.append(turn.text);
  }
  return turn.text;
}

function actLine(name,arg,running){
  if(!turn.acts){ turn.acts=frag('<div class="acts"></div>'); turn.work.append(turn.acts); }
  // Consecutive calls to the same tool collapse into a count. A run that reads twenty files should
  // occupy one line, not twenty.
  if(turn.lastTool===name && turn.acts.lastElementChild){
    turn.lastCount++;
    const last=turn.acts.lastElementChild;
    last.querySelector('.ar').textContent=arg||'';
    let c=last.querySelector('.cnt');
    if(!c){ c=frag('<span class="cnt"></span>'); last.append(c); }
    c.textContent='×'+turn.lastCount;
    return last;
  }
  turn.lastTool=name; turn.lastCount=1;
  const n=frag('<div class="act'+(running?' run':'')+'"><span class="dot"></span>'+
    '<span class="nm">'+esc(name)+'</span><span class="ar">'+esc(arg||'')+'</span></div>');
  turn.acts.append(n);
  return n;
}

function thinkNode(){
  if(!turn.think){
    turn.think=frag('<details class="think"><summary>thinking…</summary><div class="body"></div></details>');
    turn.work.append(turn.think);
  }
  return turn.think;
}

function finishTurn(result){
  if(turn?.text) turn.text.classList.remove('live');
  turn?.acts?.querySelectorAll('.act.run').forEach(a=>a.classList.remove('run'));
  if(!turn) return;

  const secs=((Date.now()-started)/1000).toFixed(1);
  const bits=[secs+'s'];
  if(result?.total_cost_usd!=null) bits.push('$'+result.total_cost_usd.toFixed(4));
  const u=result?.usage;
  if(u) bits.push(((u.input_tokens??0)+(u.output_tokens??0)).toLocaleString()+' tok');

  turn.foot.innerHTML=bits.map(b=>'<span>'+esc(b)+'</span>').join('')+
    '<span class="sp"></span><button class="act-btn" data-copy>copy</button>';
  turn.foot.classList.remove('hidden');
  const raw=turn.text?.dataset.raw??'';
  turn.foot.querySelector('[data-copy]').onclick=e=>{
    navigator.clipboard.writeText(raw);
    e.target.textContent='copied';
    setTimeout(()=>{ e.target.textContent='copy'; },1200);
  };

  if(turn.think) turn.think.querySelector('summary').textContent='thought for '+secs+'s';
}

/* ── stream handling ───────────────────────────────────────────────────── */
/** Render one stream-json record. The browser interprets the shape, so there is one place to change. */
function record(r){
  if(r.type==='system'&&r.subtype==='init'){
    const fresh=!sessionId;
    sessionId=r.session_id??sessionId;
    if(fresh&&sessionId) setSessionName('Session '+sessionId.split('-')[0]);
    el('agent-model').textContent=r.model??'';
    drawStatus(); return;
  }
  const d=r.event?.delta;

  if(r.type==='stream_event'&&d?.type==='text_delta'){
    const n=textNode();
    n.dataset.raw+=d.text;
    n.innerHTML=md(n.dataset.raw);
    n.classList.add('live');
    follow(); return;
  }
  if(r.type==='stream_event'&&d?.type==='thinking_delta'){
    thinkNode().querySelector('.body').textContent+=d.thinking;
    follow(); return;
  }
  if(r.type==='assistant'){
    for(const b of r.message?.content??[]){
      if(b.type!=='tool_use') continue;
      // A new tool means the prose before it is finished.
      if(turn.text){ turn.text.classList.remove('live'); turn.text=null; }
      const i=b.input??{};
      const arg=i.command??i.file_path??i.path??i.pattern??i.description??'';
      actLine(b.name,trimRepo(String(arg)).split('\n')[0].slice(0,120),true);
      follow();
    }
    return;
  }
  if(r.type==='result'){
    if(r.total_cost_usd!=null) cost=r.total_cost_usd;
    sessionId=r.session_id??sessionId;
    finishTurn(r);
    refresh();
    tabs.filter(t=>!t.dirty).forEach(reload);
    follow();
  }
}

async function reload(tab){
  const r=await fetch('/api/file?path='+encodeURIComponent(tab.path));
  if(!r.ok) return;
  const text=(await r.json()).content;
  tab.content=text;
  const m=models.get(tab.path);
  // setValue would wipe undo history and jump the cursor. A full-range edit keeps both, so the
  // agent's change is undoable like any other.
  if(m&&m.getValue()!==text) m.pushEditOperations([],[{range:m.getFullModelRange(),text}],()=>null);
  if(tab.path===active&&view!=='src') draw();
}

function busy(on){
  el('send').disabled=on;
  el('stop').classList.toggle('hidden',!on);
  drawStatus();
}

function send(text){
  const box=el('prompt');
  const prompt=(text??box.value).trim();
  if(!prompt||stream) return;
  el('log').querySelector('.start')?.remove();

  // Attached files ride along as @paths, which is the convention Claude Code already uses.
  const withCtx=[...attached].map(p=>'@'+p).join(' ');
  const full=withCtx?withCtx+'\n\n'+prompt:prompt;

  turn=newTurn(full); started=Date.now();
  box.value=''; autoGrow(); attached.clear(); drawCtx();
  pinned=true; follow(); busy(true);

  stream=new EventSource('/api/chat?prompt='+encodeURIComponent(full)+'&mode='+permMode+
    (sessionId?'&session='+encodeURIComponent(sessionId):''));
  stream.addEventListener('msg',e=>{ try{ record(JSON.parse(e.data)); }catch(_){} });
  stream.addEventListener('fatal',e=>{
    turn.work.append(frag('<div class="err">'+esc(e.data)+'</div>'));
  });
  const end=()=>{ if(stream){ stream.close(); stream=null; busy(false); finishTurn(null); } };
  stream.addEventListener('done',end);
  stream.onerror=end;
}
el('send').onclick=()=>send();
el('stop').onclick=()=>{ if(stream){ stream.close(); stream=null; busy(false); finishTurn(null); } };

/* ── composer ──────────────────────────────────────────────────────────── */
const attached=new Set();

function autoGrow(){
  const t=el('prompt');
  t.style.height='auto';
  t.style.height=Math.min(t.scrollHeight,window.innerHeight*0.4)+'px';
}
function drawCtx(){
  const box=el('ctx');
  box.classList.toggle('hidden',attached.size===0);
  box.innerHTML=[...attached].map(p=>'<span class="tag">'+esc(p.split('/').pop())+
    '<button data-x="'+esc(p)+'">×</button></span>').join('');
  box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ attached.delete(b.dataset.x); drawCtx(); });
}

/* @-mention: type @ then filter the tree. Uses the same scorer as the command palette. */
let mentOpen=false, mentHits=[], mentIdx=0, mentAt=-1;
function closeMent(){ mentOpen=false; el('ment').classList.add('hidden'); }
function mentFilter(){
  const t=el('prompt'), pos=t.selectionStart;
  const upto=t.value.slice(0,pos);
  const m=upto.match(/@([\w./\-]*)$/);
  if(!m){ closeMent(); return; }
  mentAt=pos-m[0].length;
  const q=m[1];
  mentHits=files.map(p=>({p,_s:score(p,q)})).filter(x=>x._s>0)
    .sort((a,b)=>b._s-a._s).slice(0,30).map(x=>x.p);
  if(!mentHits.length){ closeMent(); return; }
  mentIdx=0; mentOpen=true; drawMent();
}
function drawMent(){
  el('ment').classList.remove('hidden');
  el('ment').innerHTML=mentHits.map((p,i)=>{
    const name=p.split('/').pop(), dir=p.slice(0,-name.length);
    return '<div class="m'+(i===mentIdx?' on':'')+'" data-i="'+i+'">'+esc(name)+
      (dir?' <span class="dim">'+esc(dir)+'</span>':'')+'</div>';
  }).join('');
  el('ment').querySelectorAll('.m').forEach(n=>n.onclick=()=>pickMent(+n.dataset.i));
  el('ment').querySelector('.on')?.scrollIntoView({block:'nearest'});
}
function pickMent(i){
  const p=mentHits[i]; if(!p) return;
  const t=el('prompt');
  t.value=t.value.slice(0,mentAt)+t.value.slice(t.selectionStart);
  t.selectionStart=t.selectionEnd=mentAt;
  attached.add(p); drawCtx(); closeMent(); t.focus(); autoGrow();
}

el('prompt').addEventListener('input',()=>{ autoGrow(); mentFilter(); });
el('prompt').addEventListener('keydown',e=>{
  if(mentOpen){
    if(e.key==='ArrowDown'){ mentIdx=Math.min(mentIdx+1,mentHits.length-1); drawMent(); e.preventDefault(); return; }
    if(e.key==='ArrowUp'){ mentIdx=Math.max(mentIdx-1,0); drawMent(); e.preventDefault(); return; }
    if(e.key==='Enter'||e.key==='Tab'){ pickMent(mentIdx); e.preventDefault(); return; }
    if(e.key==='Escape'){ closeMent(); e.preventDefault(); return; }
  }
  if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); send(); }
});

/* ── empty state ───────────────────────────────────────────────────────── */
/** Suggestions come from what the scan actually found, so the first move is never generic. */
function emptyLog(){
  const s=state?.scan, w=state?.workspace;
  const items=[];
  const blocking=(s?.findings??[]).filter(f=>f.severity==='critical'||f.severity==='high');
  if(blocking.length) items.push({
    t:'Fix the '+blocking.length+' blocking finding'+(blocking.length>1?'s':''),
    d:blocking[0].title,
    p:'Fix the blocking readiness findings in this repository, starting with: '+blocking[0].title,
  });
  const untrusted=(w?.hooks??[]).filter(h=>h.scope==='project').length+
                  (w?.mcp_servers??[]).filter(m=>m.scope==='project').length;
  if(untrusted) items.push({
    t:'Review what this repo will execute',
    d:untrusted+' hook or MCP server came with the checkout',
    p:'Review the hooks and MCP servers this repository ships and tell me whether they are safe.',
  });
  if(git?.changes?.length) items.push({
    t:'Explain the '+git.changes.length+' uncommitted change'+(git.changes.length>1?'s':''),
    d:'on '+(git.branch??'this branch'),
    p:'Summarise the uncommitted changes in this repository and flag anything that looks unfinished.',
  });
  items.push({
    t:'Explain this codebase',
    d:'structure, entry points, how to run it',
    p:'Explain how this codebase is structured: the entry points, the main modules, and how to run it.',
  });

  el('log').innerHTML='<div class="start"><h3>What should the agent do?</h3>'+
    '<p>It works in this repository, on your machine, with your Claude subscription.</p>'+
    '<div class="sugg">'+items.slice(0,4).map((i,n)=>
      '<button data-s="'+n+'"><b>'+esc(i.t)+'</b><span>'+esc(i.d)+'</span></button>').join('')+
    '</div></div>';
  el('log').querySelectorAll('[data-s]').forEach(b=>
    b.onclick=()=>send(items[+b.dataset.s].p));
}

/* ── sessions ──────────────────────────────────────────────────────────── */
function setSessionName(t){ el('sess-name').textContent=t; }

el('a-new').onclick=()=>{
  sessionId=null; cost=null; turn=null; setSessionName('New session');
  el('sess-list').classList.add('hidden'); emptyLog(); drawStatus();
};

el('sess-btn').onclick=()=>{
  const box=el('sess-list');
  if(!box.classList.contains('hidden')){ box.classList.add('hidden'); return; }
  const list=state?.workspace.sessions??[];
  box.innerHTML=list.length
    ? list.map(s=>'<div class="card click'+(s.id===sessionId?' on':'')+'" data-s="'+esc(s.id)+'">'+
        '<div class="t">'+esc(s.title??'(untitled)')+'</div>'+
        '<div class="m">'+s.messages+' msg · '+esc((s.last_active??'').slice(0,16).replace('T',' '))+
        (s.branch?' · '+esc(s.branch):'')+'</div></div>').join('')
    : '<div class="empty">No sessions recorded in this project yet.</div>';
  box.classList.remove('hidden');
  box.querySelectorAll('[data-s]').forEach(n=>n.onclick=()=>openSession(n.dataset.s));
};

/** Load a past conversation and continue it. The next message resumes this session id. */
async function openSession(id){
  el('sess-list').classList.add('hidden');
  const meta=(state?.workspace.sessions??[]).find(s=>s.id===id);
  sessionId=id; cost=null; turn=null;
  setSessionName(meta?.title??id.split('-')[0]);
  el('log').innerHTML='<div class="start"><p>Loading…</p></div>';

  const turns=await (await fetch('/api/session?id='+encodeURIComponent(id))).json();
  el('log').innerHTML='';
  if(!turns.length){
    el('log').innerHTML='<div class="start"><p>This transcript could not be read.</p></div>';
    return;
  }
  // Replay as turns so an opened session looks exactly like a live one.
  let cur=null;
  for(const t of turns){
    if(t.role==='user'){ cur=newTurn(t.text); continue; }
    if(!cur) cur=newTurn('');
    if(t.text){
      const n=frag('<div class="txt"></div>');
      n.innerHTML=md(t.text); n.dataset.raw=t.text;
      cur.work.append(n);
    }
    for(const name of t.tools){
      turn=cur; actLine(name,'',false);
    }
  }
  turn=null;
  pinned=true; el('log').scrollTop=el('log').scrollHeight;
  drawStatus();
}

/* ════ preferences ═══════════════════════════════════════════════════════
   Kept in localStorage and applied to Monaco on change, so the editor obeys
   them immediately rather than on reload. */
const PREF_DEFAULTS={theme:'system',fontSize:12.5,tabSize:2,minimap:true,wordWrap:false,
  lineNumbers:true,stickyScroll:true,defaultMode:'acceptEdits'};
let prefs={...PREF_DEFAULTS,...JSON.parse(localStorage.getItem('keel.prefs')||'{}')};

function savePrefs(){
  localStorage.setItem('keel.prefs',JSON.stringify(prefs));
  applyPrefs();
}
function applyPrefs(){
  document.documentElement.dataset.theme = prefs.theme==='system' ? '' : prefs.theme;
  if(prefs.theme==='system') delete document.documentElement.dataset.theme;
  Object.assign(EDITOR_OPTS,{
    fontSize:prefs.fontSize,
    tabSize:prefs.tabSize,
    minimap:{...EDITOR_OPTS.minimap,enabled:prefs.minimap},
    wordWrap:prefs.wordWrap?'on':'off',
    lineNumbers:prefs.lineNumbers?'on':'off',
    stickyScroll:{enabled:prefs.stickyScroll},
  });
  if(window.monaco&&mon){ mon.updateOptions(EDITOR_OPTS); defineTheme(); }
  if(window.monaco&&monDiff){ monDiff.updateOptions(EDITOR_OPTS); }
}

    el('set-pane').querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{
      prefs.defaultMode=b.dataset.dm; savePrefs(); setMode(b.dataset.dm); drawSettings();

    el('set-pane').innerHTML='<section><h1>Keel</h1>'+

      '<div class="pref"><div class="lbl"><b>Editor</b><span>Monaco, vendored and compiled into the binary.</span></div></div>'+
      '<div class="pref"><div class="lbl"><b>Server</b><span>Loopback only, and not configurable.</span></div></div>'+
      '<h2>Keyboard</h2>'+
      ['⌘P  find a file','⌘⇧P  commands','⌘B  sidebar','⌃`  agent panel','⌘S  save',
       '⌘,  settings','⌘K W  close tab','⌘K ←/→  switch tab','⇧⇥  Plan / Auto','esc  interrupt']
        .map(k=>'<div class="pref"><div class="lbl"><b style="font-family:var(--mono);font-size:12px">'+

async function loadCatalog(){
  const r=await fetch('/api/plugins?repo='+encodeURIComponent(state?.repo??''));
  catalog=await r.json();
}

function installPlugin(name,marketplace,host){
  host.innerHTML='<pre class="console" id="pl-out"></pre>';
  const out=el('pl-out');
  const es=new EventSource('/api/plugins/install?name='+encodeURIComponent(name)+
    '&marketplace='+encodeURIComponent(marketplace));
  const write=t=>{ out.textContent+=t+'\n'; out.scrollTop=1e9; };
  es.addEventListener('line',e=>write(e.data));
  es.addEventListener('fatal',e=>{ write(e.data); es.close(); });
  es.addEventListener('done',async e=>{
    es.close();
    write(e.data==='0'?'\n✓ installed — restart the agent session to pick it up':'\nexited '+e.data);
    catalog=null; await refresh();
    if(setsTab==='plugins') SET_PANES.plugins();
  });
}

  const post=(url,body)=>fetch(url,{method:'POST',headers:{'content-type':'application/json'},

  el('gh-repos')&&(el('gh-repos').onclick=async()=>{
    el('repos').innerHTML='<p class="lede">Loading…</p>';

    const list=await r.json();

      '<div id="cl-'+i+'"></div></div>'+
      '<button class="btn quiet" data-clone="'+i+'">Clone</button></div>').join('');
    el('repos').querySelectorAll('[data-clone]').forEach(b=>b.onclick=async()=>{
      const x=list[+b.dataset.clone];
      el('cl-'+b.dataset.clone).innerHTML='<div class="note dim">cloning…</div>';

      else el('cl-'+b.dataset.clone).innerHTML='<div class="note bad">'+esc(await res.text())+'</div>';

}
