[package]
name = "keel-desktop"
version = "0.3.8"
edition = "2024"

# Its own workspace: Tauri and the webview bindings are a long compile, and `make check` on the
# daemon should not pay for them.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` for child webviews: the design preview is one, laid over the side panel.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tempfile = "3"
ed25519-dalek = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
