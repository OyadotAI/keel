[package]
name = "keel-desktop"
version = "0.4.32"
edition = "2024"

# Its own workspace: Tauri and the webview bindings are a long compile, and `make check` on the
# daemon should not pay for them.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` for child webviews: the design preview is one, laid over the side panel.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Browser tab waits for a page load and for a script's answer (browser.rs). Already in the build through Tauri.
tokio = { version = "1", features = ["sync", "time"] }
getrandom = "0.3"
tempfile = "3"
ed25519-dalek = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Where a child webview really is in the window (browser.rs, preview.rs): Tauri's sizes say the
# window has no title bar while it has one, so placement is measured on the native views. Already
# in the build through wry, at these versions and features.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSView", "NSWindow", "NSResponder"] }

# tao 0.37.1 declares its AppKit overrides `extern "C"`, so an Objective-C exception raised under
# `-[NSApplication sendEvent:]` cannot unwind to NSApplication's own handler and aborts the app
# (`panic_cannot_unwind`, no exception in the report). macOS 27 raises one from the Siri affordance
# over selected text, and 0.4.4 crashed that way. tao#1354 makes them `C-unwind`; drop this once a
# tao release carries it. Needs `panic = "unwind"`, the default, which this workspace keeps.
[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", rev = "8423382b67d0993815caf2c8da0b2899c50556f5" }
