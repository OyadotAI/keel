# Keel review: the repository's team reviews a pull request and posts one comment.
#
# Published to OyadotAI/keel-releases at `review/action.yml` by release.yml, so it is used as
# `OyadotAI/keel-releases/review@<tag>` and downloads the `keel` of that same release: a
# `review-v*` tag (review.yml, the review alone) or an app release `v*` (release.yml).
# Everything that decides anything is `keel review-pr`; this only installs, runs and posts.
#
# Use it under `pull_request`, never `pull_request_target`: the second runs the PR's code with
# this repository's secrets. Under `pull_request` a fork's PR gets no secrets, and the review
# skips with one line in the log rather than failing.
name: Keel review
description: Review a pull request with the repository's Keel team and post one comment.
branding:
  icon: check-circle
  color: blue
inputs:
  anthropic-api-key:
    description: An Anthropic API key. Or use claude-code-oauth-token, or api-proxy-url.
    required: false
  claude-code-oauth-token:
    description: A Claude Code OAuth token (`claude setup-token`).
    required: false
  api-proxy-url:
    description: An http(s) gateway in front of the Anthropic API (ANTHROPIC_BASE_URL). Treated as a secret.
    required: false
  api-proxy-token:
    description: Bearer token for the gateway (ANTHROPIC_AUTH_TOKEN). Optional.
    required: false
  fail-on-block:
    description: Fail the check when the verdict is "do not ship" or there is no verdict.
    default: "true"
  minutes:
    description: Stop the review after this many minutes.
    default: "30"
  model:
    description: The model to review with. Claude Code's default otherwise.
    required: false
  version:
    # Written in by release.yml, so a pin by SHA runs the same release a pin by tag does.
    description: The Keel release to run. Defaults to the release this action was published with.
    default: "__KEEL_VERSION__"
  claude-version:
    description: The Claude Code version to install.
    default: "2.1.304"
  github-token:
    description: Posts the comment. Needs pull-requests write.
    default: ${{ github.token }}
outputs:
  verdict:
    description: ship, do not ship, none, or skipped.
    value: ${{ steps.review.outputs.verdict }}
runs:
  using: composite
  steps:
    - name: Mask the proxy URL
      shell: bash
      env:
        URL: ${{ inputs.api-proxy-url }}
      run: if [ -n "$URL" ]; then echo "::add-mask::$URL"; fi

    - name: Install keel and Claude Code
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ inputs.version }}
        CLAUDE_VERSION: ${{ inputs.claude-version }}
      run: |
        set -euo pipefail
        case "$VERSION" in
          v*|review-v*) ;;
          *) echo "keel review: this copy of the action was not published by a release; set version (v0.4.13)." >&2; exit 1 ;;
        esac
        dir="$RUNNER_TEMP/keel-bin"
        mkdir -p "$dir"
        gh release download "$VERSION" -R OyadotAI/keel-releases -p keel-linux-x64.tar.gz -D "$dir" --clobber
        tar -xzf "$dir/keel-linux-x64.tar.gz" -C "$dir"
        echo "$dir" >> "$GITHUB_PATH"
        npm install -g --silent "@anthropic-ai/claude-code@$CLAUDE_VERSION"

    # No GH_TOKEN here: `keel review-pr` passes the agent an allowlisted environment anyway, and
    # the write token is not in this step to be passed.
    # The review's own open threads on this PR, each with every reply, so this run can say which
    # are fixed, which are answered and which still stand, in the same thread. Only threads Keel
    # opened: the first comment is a bot's and ends in the line marker.
    - name: Read the open review threads
      id: threads
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        COMMENTER: ${{ github.event.comment.user.type }}
        ASSOCIATION: ${{ github.event.comment.author_association }}
        THREADS: ${{ runner.temp }}/keel-review-threads.json
      run: |
        set -euo pipefail
        # GitHub's API returns the odd 502/503; a review must not turn red over one.
        gh() { local i; for i in 1 2 3 4; do command gh "$@" && return 0; [ $i = 4 ] && return 1; sleep $((i * 5)); done; }
        echo '[]' > "$THREADS"
        # A reply run that a bot started is Keel answering itself (an app token's comments do
        # trigger workflows): nothing to do.
        if [ "$GITHUB_EVENT_NAME" = "pull_request_review_comment" ] && [ "$COMMENTER" = "Bot" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # Anyone can reply on a public PR, and this run holds the secrets. Only someone with a
        # say over the repository gets an answer; anyone else's reply waits for the next push.
        if [ "$GITHUB_EVENT_NAME" = "pull_request_review_comment" ]; then
          case "$ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) ;; *)
            echo "keel review: $ASSOCIATION replies are answered at the next push, not now." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
        fi
        [ -n "$PR" ] || exit 0
        gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F repo="${GITHUB_REPOSITORY#*/}" -F n="$PR" -f query='
          query($owner: String!, $repo: String!, $n: Int!) {
            repository(owner: $owner, name: $repo) { pullRequest(number: $n) {
              reviewThreads(first: 100) { nodes { id isResolved path line originalLine
                comments(first: 50) { nodes { databaseId body authorAssociation author { login __typename } } } } } } } }' \
          --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                 | select((.isResolved | not) and .comments.nodes[0].author.__typename == "Bot"
                          and (.comments.nodes[0].body | endswith("<!-- keel-review-line -->")))
                 | {id, comment_id: .comments.nodes[0].databaseId, path, line: (.line // .originalLine),
                    comments: [.comments.nodes[] | {author: (.author.login // "ghost"),
                                                    bot: (.author.__typename == "Bot"), association: .authorAssociation, body}]}]' \
          > "$THREADS" || { echo '[]' > "$THREADS"; echo "keel review: could not read the review threads; replying to none." >&2; }

    - name: Review
      id: review
      if: steps.threads.outputs.skip != 'true'
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        ANTHROPIC_BASE_URL: ${{ inputs.api-proxy-url }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.api-proxy-token }}
        MINUTES: ${{ inputs.minutes }}
        MODEL: ${{ inputs.model }}
        OUT: ${{ runner.temp }}/keel-review.md
        LINES: ${{ runner.temp }}/keel-review-lines.json
        THREADS: ${{ runner.temp }}/keel-review-threads.json
        ACTIONS: ${{ runner.temp }}/keel-review-thread-actions.json
      run: |
        rm -f "$OUT" "$LINES" "$ACTIONS"
        args=(review-pr --out "$OUT" --comments "$LINES" --threads "$THREADS" --thread-actions "$ACTIONS" --minutes "$MINUTES")
        if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
        # Someone replied on a thread: answer it now, without re-running the whole team.
        if [ "$GITHUB_EVENT_NAME" = "pull_request_review_comment" ]; then args+=(--replies-only); fi
        set +e
        keel "${args[@]}"
        code=$?
        set -e
        case "$code" in
          0) if [ -f "$OUT" ]; then verdict=ship; else verdict=skipped; fi ;;
          1) verdict="do not ship" ;;
          *) verdict=none ;;
        esac
        echo "code=$code" >> "$GITHUB_OUTPUT"
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

    # One summary comment per PR: the marker finds it, and only a bot's is edited, so a person
    # quoting the marker does not get their comment overwritten. Line comments are never
    # deleted: a thread is where people answer a finding, and the reply below closes it.
    - name: Post the comment
      if: always() && steps.review.outputs.code != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        OUT: ${{ runner.temp }}/keel-review.md
        LINES: ${{ runner.temp }}/keel-review-lines.json
        ACTIONS: ${{ runner.temp }}/keel-review-thread-actions.json
      run: |
        set -uo pipefail
        # GitHub's API returns the odd 502/503; a review must not turn red over one.
        gh() { local i; for i in 1 2 3 4; do command gh "$@" && return 0; [ $i = 4 ] && return 1; sleep $((i * 5)); done; }
        # Posting is what people see, but the verdict is decided already: a post that still
        # fails after the retries is a warning, and the Verdict step below sets the check.
        post() {
        if [ -z "$PR" ]; then echo "keel review: not a pull_request event, so there is nowhere to comment." >&2; exit 0; fi
        if [ -f "$OUT" ]; then
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.type == "Bot" and (.body | startswith("<!-- keel-review -->"))) | .id] | first // empty')"
          # A comment another account posted cannot be edited (a switch from GITHUB_TOKEN to an
          # app token is exactly that), so a refused edit becomes a new comment, not a red job.
          me=""
          if [ -n "$id" ]; then
            me="$(gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$OUT" --jq .user.login 2>/dev/null)" || me=""
          fi
          if [ -z "$me" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$OUT" >/dev/null || return 1
          fi
        fi
        # Each judged thread: the reply in the thread, then resolved when fixed or answered.
        if [ -s "$ACTIONS" ]; then
          jq -c '.[]' "$ACTIONS" | while read -r action; do
            cid="$(jq -r .comment_id <<<"$action")"
            tid="$(jq -r .thread_id <<<"$action")"
            jq -r .reply <<<"$action" > "$RUNNER_TEMP/keel-reply.md"
            gh api -X POST "repos/$GITHUB_REPOSITORY/pulls/$PR/comments/$cid/replies" -F body=@"$RUNNER_TEMP/keel-reply.md" >/dev/null \
              || echo "keel review: could not reply on thread $tid." >&2
            if [ "$(jq -r .resolve <<<"$action")" = "true" ]; then
              gh api graphql -f id="$tid" -f query='mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }' >/dev/null \
                || echo "keel review: could not resolve thread $tid." >&2
            fi
          done
        fi
        if [ -s "$LINES" ] && [ "$(jq length "$LINES")" -gt 0 ]; then
          # A line comment GitHub refuses fails the whole review; the summary has them all anyway.
          jq -n --arg sha "$HEAD" --slurpfile c "$LINES" \
            '{commit_id: $sha, event: "COMMENT", body: "", comments: $c[0]}' |
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --input - >/dev/null \
            || echo "keel review: GitHub refused the line comments; every finding is in the summary comment." >&2
        fi
        }
        post || echo "::warning::keel review: could not post everything to the PR; the verdict below still stands."

    - name: Verdict
      if: always() && steps.review.outputs.code != ''
      shell: bash
      env:
        CODE: ${{ steps.review.outputs.code }}
        FAIL: ${{ inputs.fail-on-block }}
        OUT: ${{ runner.temp }}/keel-review.md
      run: |
        [ -n "$CODE" ] || exit 0
        if [ "$GITHUB_EVENT_NAME" = "pull_request_review_comment" ]; then
          [ "$CODE" = 0 ] && exit 0
          echo "keel review: the replies were not answered; see the Review step." >&2; exit 1
        fi
        case "$CODE" in
          0) exit 0 ;;
          1) echo "keel review: do not ship." >&2 ;;
          *) if [ -f "$OUT" ]; then echo "keel review: no verdict; the comment says why." >&2
             else echo "keel review: keel review-pr exited $CODE without a report; see the Review step." >&2; exit 1; fi ;;
        esac
        [ "$FAIL" = "true" ] && exit 1 || exit 0
