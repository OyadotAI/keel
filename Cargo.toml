[workspace]
members = [
    "crates/keel",
    "crates/keel-harness",
    "crates/keel-mcp",
    "crates/keel-scanner",
    "crates/keel-workspace",
    "crates/keel-providers",
    "crates/keel-generator",
]
resolver = "3"

[workspace.package]
version = "0.4.33"
edition = "2024"
license-file = "LICENSE.md"
repository = "https://github.com/OyadotAI/keel"

[workspace.dependencies]
keel-harness = { path = "crates/keel-harness" }
keel-mcp = { path = "crates/keel-mcp" }
keel-scanner = { path = "crates/keel-scanner" }
keel-workspace = { path = "crates/keel-workspace" }
# Private (OyadotAI/keel-license): the license meter, keys and usage report. Fetched over SSH;
# CI reads it with a deploy key. A published source tree patches this to a stub.
keel-license = { git = "ssh://git@github.com/OyadotAI/keel-license.git", rev = "3af073fcc8226759e8538ddfcece053eb6455f55" }
keel-providers = { path = "crates/keel-providers" }
keel-generator = { path = "crates/keel-generator" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
camino = { version = "1", features = ["serde1"] }
ignore = "0.4"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace"] }
open = "5"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Crash reports from the daemon, tagged like the app's. Rustls so the Linux runner needs no
# OpenSSL headers.
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
