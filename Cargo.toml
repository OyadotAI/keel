[workspace]
members = [
    "crates/keel",
    "crates/keel-harness",
    "crates/keel-mcp",
    "crates/keel-scanner",
    "crates/keel-workspace",
    "crates/keel-providers",
    "crates/keel-generator",
]
resolver = "3"

[workspace.package]
version = "0.2.49"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/keel-dev/keel"

[workspace.dependencies]
keel-harness = { path = "crates/keel-harness" }
keel-mcp = { path = "crates/keel-mcp" }
keel-scanner = { path = "crates/keel-scanner" }
keel-workspace = { path = "crates/keel-workspace" }
keel-providers = { path = "crates/keel-providers" }
keel-generator = { path = "crates/keel-generator" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
camino = { version = "1", features = ["serde1"] }
ignore = "0.4"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace"] }
open = "5"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Crash reports from the daemon, tagged like the app's. Rustls so the Linux runner needs no
# OpenSSL headers.
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
