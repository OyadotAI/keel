name: release-cache

# The release builds' Rust dependencies, compiled on `main` so a release can use them.
#
# A release runs on its tag, and GitHub lets a ref read only the caches made on itself or on the
# default branch. Every release is a new tag, so each one saved a cache no later release could
# read: measured, the macOS job said "No cache found" and compiled every dependency from scratch,
# twice (one per architecture), which was most of its 40 minutes. This builds exactly what the
# release builds (`tauri build` with `--no-bundle`: the same compile, no signing, no installers)
# under the same cache keys, on `main`, so every tag restores it.
#
# Run when the dependencies or the toolchain change, and weekly: GitHub evicts a cache nobody
# has read for seven days, and a quiet week between releases would otherwise lose it.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - desktop/src-tauri/Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain*
      - .github/workflows/release-cache.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cache
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read access to keel-license
        shell: bash
        env:
          KEY: ${{ secrets.KEEL_LICENSE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/keel_license && chmod 600 ~/.ssh/keel_license
          printf 'Host github.com\n  IdentityFile ~/.ssh/keel_license\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # The same key as the release's macOS job (release.yml), which is what makes it readable there.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-macos
          workspaces: |
            .
            desktop/src-tauri
      - name: Build the daemon
        run: packaging/sidecar.sh release universal
      - name: Build the app, without bundling or signing
        working-directory: desktop
        run: |
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
          pnpm runtime:stage universal-apple-darwin
          pnpm tauri build --target universal-apple-darwin --no-bundle

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read access to keel-license
        shell: bash
        env:
          KEY: ${{ secrets.KEEL_LICENSE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/keel_license && chmod 600 ~/.ssh/keel_license
          printf 'Host github.com\n  IdentityFile ~/.ssh/keel_license\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-windows
          workspaces: |
            .
            desktop/src-tauri
      - name: Build the daemon
        run: packaging/sidecar.sh release x86_64-pc-windows-msvc
      - name: Build the app, without bundling
        working-directory: desktop
        run: |
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
          pnpm runtime:stage x86_64-pc-windows-msvc
          pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle

  linux-cli:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read access to keel-license
        shell: bash
        env:
          KEY: ${{ secrets.KEEL_LICENSE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/keel_license && chmod 600 ~/.ssh/keel_license
          printf 'Host github.com\n  IdentityFile ~/.ssh/keel_license\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: release-linux
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - run: cargo build --release --locked -p keel
