name: review

# The review action's own release: a `review-v*` tag builds the Linux `keel` that
# packaging/action/review runs, and publishes it with the action to the feed. Three minutes, where
# an app release (`v*`, release.yml) waits on macOS notarisation and the Windows installer — which
# the review uses neither of. `make release-review` cuts one.
#
# The daemon ships inside the app, so a change to anything else in Rust is an app release.
on:
  push:
    tags: ["review-v*"]

permissions:
  contents: read

concurrency:
  group: review-release
  cancel-in-progress: false

env:
  FEED: OyadotAI/keel-releases

jobs:
  publish:
    # 22.04, so the glibc it links against is one every GitHub-hosted runner still has.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read access to keel-license
        shell: bash
        env:
          KEY: ${{ secrets.KEEL_LICENSE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/keel_license && chmod 600 ~/.ssh/keel_license
          printf 'Host github.com\n  IdentityFile ~/.ssh/keel_license\n  IdentitiesOnly yes\n' >> ~/.ssh/config
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - run: cargo build --release --locked -p keel
      - run: ./target/release/keel review-pr --help >/dev/null

      # The action goes on the feed's default branch first and the release is created at that
      # commit, so `review@<tag>` resolves to the action that matches the binary beside it.
      # Not `--latest`: the app's updater follows the latest release, and this is not the app.
      - name: Publish the action and the binary
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          mkdir -p out
          tar -czf out/keel-linux-x64.tar.gz -C target/release keel
          sed -i "s/__KEEL_VERSION__/$GITHUB_REF_NAME/" packaging/action/review/action.yml
          commit=""
          for f in action.yml README.md; do
            # `|| sha=""`, not `|| true` inside: on a 404, gh still prints the error body to stdout.
            sha="$(gh api "repos/$FEED/contents/review/$f" --jq .sha 2>/dev/null)" || sha=""
            commit="$(gh api -X PUT "repos/$FEED/contents/review/$f" \
              -f message="Keel review $GITHUB_REF_NAME: review/$f" \
              -f content="$(base64 -w0 "packaging/action/review/$f")" \
              ${sha:+-f sha="$sha"} --jq .commit.sha)"
          done
          gh release create "$GITHUB_REF_NAME" out/keel-linux-x64.tar.gz -R "$FEED" \
            --target "$commit" --latest=false --title "Keel review ${GITHUB_REF_NAME#review-}" \
            --notes "The pull request review action. Use it as \`OyadotAI/keel-releases/review@$GITHUB_REF_NAME\`."
