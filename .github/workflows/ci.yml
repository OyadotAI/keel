name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# The token reads and nothing else; a second push cancels the first; no job outlives an hour.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    # Hosted macOS/Xcode runner: fork PRs get no signing, analytics, or release secrets.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      KEEL_SIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install icon renderer in an isolated environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install Pillow
      - name: Build the native bundle and run Swift tests
        run: |
          source .venv/bin/activate
          make app-test

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Pinned by SHA, so the toolchain no longer comes from the `@stable` ref name.
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Keel is a macOS app, but it builds on a Linux runner because that is where CI minutes are
      # cheap. `wry`/`tao` reach for GTK and WebKit through pkg-config on Linux, and without these
      # the workspace does not compile at all: `glib-sys` fails its build script before a single
      # check runs. `libwebkit2gtk-4.1-dev` is the one that matters (webkit2gtk-sys 2.0 wants the
      # 4.1/libsoup3 line, not 4.0); the rest are named so a miss says which package is absent
      # rather than surfacing as a transitive surprise.
      - name: Install GTK and WebKit development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libxdo-dev

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Keel is subject to its own scanner. If the readiness bar is worth holding other repositories
  # to, it is worth holding this one to — and a regression here means the scanner shipped a false
  # positive, which is the most damaging bug class it has.
  self-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Pinned by SHA, so the toolchain no longer comes from the `@stable` ref name.
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Same reason as `check` above: `scan` is a subcommand of the `keel` binary, so reaching it
      # means linking the whole GUI stack.
      - name: Install GTK and WebKit development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libxdo-dev

      - run: cargo run --release --quiet -- scan . --strict
