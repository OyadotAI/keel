name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# The token reads and nothing else; a second push cancels the first; no job outlives an hour.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Keel is a macOS app, but it builds on a Linux runner because that is where CI minutes are
      # cheap. `wry`/`tao` reach for GTK and WebKit through pkg-config on Linux, and without these
      # the workspace does not compile at all: `glib-sys` fails its build script before a single
      # check runs. `libwebkit2gtk-4.1-dev` is the one that matters (webkit2gtk-sys 2.0 wants the
      # 4.1/libsoup3 line, not 4.0); the rest are named so a miss says which package is absent
      # rather than surfacing as a transitive surprise.
      - name: Install GTK and WebKit development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libxdo-dev

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Keel is subject to its own scanner. If the readiness bar is worth holding other repositories
  # to, it is worth holding this one to — and a regression here means the scanner shipped a false
  # positive, which is the most damaging bug class it has.
  self-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Same reason as `check` above: `scan` is a subcommand of the `keel` binary, so reaching it
      # means linking the whole GUI stack.
      - name: Install GTK and WebKit development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libxdo-dev

      - run: cargo run --release --quiet -- scan . --strict
