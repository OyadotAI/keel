name: Question or setup help
description: Ask about installation, workflows, or contributing.
title: "Question: "
body:
  - type: markdown
    attributes:
      value: |
        Start with our [support guide](https://github.com/OyadotAI/keel/blob/main/SUPPORT.md).
        This is a public issue. Send sensitive security or conduct reports to mk@getoya.ai instead.
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Explain your goal and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include relevant documentation and any redacted errors.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Keel version, macOS version, and relevant tool versions
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed secrets, private code, account details, and browser login URLs.
          required: true
