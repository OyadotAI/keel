# Generated by Keel.
#
# The shape that matters: a pull request UPLOADS a version and gets a preview URL, but never
# deploys. Merging to main deploys that version to dev. Production is reached only by promotion,
# which redeploys the exact artifact already proven in dev rather than rebuilding it — rebuilding
# is how dev and prod silently diverge.
name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # for keyless signing via Sigstore

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint

  version:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.upload.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Cloudflare has no OIDC or keyless deploy path as of August 2026, so this is the one
      # credential in the pipeline that is a stored token rather than a federated identity. Keel
      # provisions it scoped to this project alone and rotates it.
      - id: upload
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions upload --env dev

  deploy-dev:
    if: github.ref == 'refs/heads/main'
    needs: version
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: versions deploy --env dev --yes

  # Production is deliberately absent from this file. Promotion happens through Keel, which shows
  # the commit diff, the binding diff, and any pending D1 migrations before a human approves it.
